<!doctype html>

<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Braille Art Generator</title>
  <meta name="description" content="Генератор арта из символов Unicode Braille. Работает полностью в браузере.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>⣿</text></svg>">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#072e20">

  <style>
    :root {
      --bg: #072e20;
      --bg-far: #0c412d;
      --panel: rgba(255, 255, 255, 0.045);
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.18);
      --accent: #22c55e;
      --accent-ink: #04240f;
      --muted: #a7e9c9;
      --ink: #e6fff3;
      --art-bg: #00120a;
      --warn: #fbbf24;
      --error: #fca5a5;
      --strip-h: 132px;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;              /* the page itself never scrolls */
      color: var(--ink);
      background: var(--bg) linear-gradient(160deg, var(--bg) 0%, var(--bg-far) 100%) fixed;
      font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* ------------------------------------------------------------------ *
     * The whole app is one viewport-tall grid: bar on top, work below.
     * Every nested scroller needs min-height:0 or it refuses to shrink and
     * pushes the page taller than the screen.
     * ------------------------------------------------------------------ */
    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      /* installed on a phone there is no browser chrome to keep clear of the
         notch, so the insets have to be honoured here */
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(12px + env(safe-area-inset-right))
        calc(12px + env(safe-area-inset-bottom))
        calc(12px + env(safe-area-inset-left));
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 16px; font-weight: 600; letter-spacing: 0.2px; white-space: nowrap; }
    .brand span { color: var(--accent); }
    .topbar .grow { flex: 1 1 auto; min-width: 0; }
    .barfield {
      display: flex; align-items: center; gap: 7px;
      margin: 0; color: var(--muted); font-size: 12.5px; white-space: nowrap;
    }
    .barfield select { width: auto; padding: 5px 8px; font-size: 13px; }

    #status {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); font-size: 13px;
    }
    #status[data-kind="ok"] { color: var(--accent); }
    #status[data-kind="warn"] { color: var(--warn); }
    #status[data-kind="error"] { color: var(--error); }

    /* segmented mode switch */
    .modes { display: flex; padding: 3px; background: rgba(0,0,0,0.28); border: 1px solid var(--line); border-radius: 9px; }
    .modes button {
      padding: 5px 13px; color: var(--muted); background: none; border: 0; border-radius: 6px;
      font: inherit; font-size: 13px; cursor: pointer;
    }
    .modes button[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); font-weight: 600; }

    .workspace {
      display: grid;
      grid-template-columns: clamp(290px, 25vw, 370px) minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
    }

    /* ---- controls column: the only part of the chrome that scrolls ---- */
    .sidebar {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      scrollbar-width: thin;
    }
    .sidebar::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

    /* one DOM tree; the mode only decides what is on screen */
    [data-mode="simple"] [data-advanced] { display: none !important; }
    [data-source="image"]  [data-when]:not([data-when~="image"])  { display: none !important; }
    [data-source="text"]   [data-when]:not([data-when~="text"])   { display: none !important; }
    [data-source="camera"] [data-when]:not([data-when~="camera"]) { display: none !important; }
    [data-source="draw"]   [data-when]:not([data-when~="draw"])   { display: none !important; }

    /* the source occupies the first pane, so drawing and framing have room */
    .canvas-wrap > video,
    .canvas-wrap > canvas { grid-area: 1 / 1; }
    #camera { width: 100%; height: 100%; min-height: 0; object-fit: contain; background: rgba(0,0,0,0.32); border-radius: 6px; }
    #drawCanvas { cursor: crosshair; touch-action: none; }

    textarea {
      width: 100%; min-height: 74px; padding: 8px 9px; resize: vertical;
      color: inherit; background: rgba(0, 0, 0, 0.26);
      border: 1px solid var(--line); border-radius: 8px;
      font: inherit; font-size: 15px; line-height: 1.35;
    }

    .field { margin-bottom: 13px; }
    .field:last-child { margin-bottom: 0; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12.5px; }

    input[type="file"], input[type="number"], select {
      width: 100%; padding: 7px 9px;
      color: inherit; background: rgba(0, 0, 0, 0.26);
      border: 1px solid var(--line); border-radius: 8px;
      font: inherit; font-size: 14px;
    }
    input[type="number"]:disabled, select:disabled, button:disabled { opacity: 0.45; cursor: not-allowed; }
    input[type="file"]::file-selector-button {
      margin-right: 10px; padding: 5px 10px; color: var(--ink);
      background: rgba(255,255,255,0.09); border: 1px solid var(--line);
      border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer;
    }

    .slider { display: flex; gap: 9px; align-items: center; }
    input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
    .readout { width: 46px; flex: none; text-align: center; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .slider button { flex: none; padding: 4px 9px; font-size: 12.5px; }

    .check { display: flex; gap: 8px; align-items: center; }
    .check input { width: 16px; height: 16px; accent-color: var(--accent); }
    .check label { margin: 0; }

    hr { margin: 15px 0; border: 0; border-top: 1px solid var(--line); }
    .group-title { margin: 0 0 9px; color: var(--ink); font-size: 12px; text-transform: uppercase; letter-spacing: 0.7px; opacity: 0.65; }

    .buttons { display: flex; flex-wrap: wrap; gap: 7px; }
    button {
      padding: 7px 12px; color: var(--ink); background: transparent;
      border: 1px solid var(--line-strong); border-radius: 8px;
      font: inherit; font-size: 13.5px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
    button.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 600; }
    button:focus-visible, input:focus-visible, select:focus-visible, .shot:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    .hint { margin: 6px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
    .panel-inset { margin-top: 10px; padding: 11px; background: rgba(0,0,0,0.24); border: 1px solid var(--line); border-radius: 8px; }
    .ruler {
      margin: 8px 0; padding: 8px; overflow-x: auto; white-space: pre;
      background: var(--art-bg); border-radius: 6px;
      font-family: "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 13px; line-height: 1;
    }
  </style>
  <style>
    /* ------------------------------------------------------------------ *
     * The stage: four panes and a footer, inside the height the window has.
     *
     * Which arrangement is a view preference, so it lives on an attribute and
     * each option is nothing but a different grid template. Every pane carries
     * min-height/min-width 0, without which a grid child refuses to shrink
     * below its content and shoves the page past the bottom of the screen.
     * ------------------------------------------------------------------ */
    .stage {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
      min-height: 0;
    }

    .panes { display: grid; gap: 10px; min-height: 0; min-width: 0; }

    /* 2x2. The default, because a preview box close to an image's own shape
       wastes far less room than a wide strip does on anything but a panorama. */
    [data-layout="grid"] .panes {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    /* Previews across the top, art below. */
    [data-layout="strip"] .panes {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: var(--strip-h) minmax(0, 1fr);
    }
    [data-layout="strip"] .shot-art { grid-column: 1 / -1; }

    /* Previews stacked at the side; everything else goes to the art. */
    [data-layout="focus"] .panes {
      grid-template-columns: minmax(0, 210px) minmax(0, 1fr);
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }
    [data-layout="focus"] .shot-art { grid-column: 2; grid-row: 1 / -1; }

    /* One row, for very wide screens. */
    [data-layout="row"] .panes {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
    }

    .shot {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
      margin: 0;
      min-width: 0;
      min-height: 0;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .shot[data-inspect] { cursor: zoom-in; }
    .shot[data-inspect]:hover { border-color: var(--line-strong); }
    .shot figcaption {
      display: flex; justify-content: space-between; gap: 8px;
      color: var(--muted); font-size: 11px; letter-spacing: 0.3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .shot figcaption b { color: var(--ink); font-weight: 500; }

    /* object-fit letterboxes the bitmap inside its box, so panes of different
       shapes still line up; the surround is kept close to the card colour so a
       wide image in a tall box does not read as a slab of black. */
    .shot canvas {
      width: 100%; height: 100%; min-height: 0;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.32);
      border-radius: 6px;
    }
    .canvas-wrap { position: relative; min-width: 0; min-height: 0; display: grid; }

    /* ---- crop selection ---- */
    .cropper { position: absolute; inset: 0; overflow: hidden; cursor: crosshair; touch-action: none; }
    .crop-frame {
      position: absolute;
      border: 1px solid var(--accent);
      /* one huge spread dims everything outside the selection; the overlay
         clips it, so no separate mask elements are needed */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
      cursor: move;
    }
    .crop-handle {
      position: absolute; width: 11px; height: 11px;
      background: var(--accent); border: 1px solid rgba(0,0,0,0.45); border-radius: 3px;
    }
    .crop-nw { left: -6px; top: -6px; cursor: nwse-resize; }
    .crop-ne { right: -6px; top: -6px; cursor: nesw-resize; }
    .crop-sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .crop-se { right: -6px; bottom: -6px; cursor: nwse-resize; }
    button[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
    #resCanvas { image-rendering: pixelated; }

    .shot-art { background: var(--art-bg); position: relative; }

    /* where the keyboard is, on surfaces a pointer would otherwise own alone */
    .dot-cursor, .pad-cursor {
      position: absolute; z-index: 5; pointer-events: none;
      border: 1px solid var(--accent);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.65);
    }
    .pad-cursor { border-radius: 50%; }
    .pad-cursor[data-pen="down"] { background: rgba(34, 197, 94, 0.35); }
    #drawCanvas:focus-visible, .cropper:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* reaching the art without walking the whole panel first */
    .skip {
      position: absolute; left: -9999px; top: 0; z-index: 40;
      padding: 8px 14px; color: var(--accent-ink); background: var(--accent);
      border-radius: 0 0 8px 0; font-size: 14px;
    }
    .skip:focus { left: 0; }
    /* while dots are being painted a drag must not select the text under it */
    .editing #output { cursor: crosshair; user-select: none; touch-action: none; }
    .editing .shot-art { outline: 1px solid var(--accent); outline-offset: -1px; }
    #output {
      margin: 0;
      min-height: 0; overflow: auto;
      color: var(--ink); background: none;
      font-family: "Cascadia Mono", "DejaVu Sans Mono", "Segoe UI Symbol", monospace;
      /* a plain number, so the aspect maths, the layout and the PNG and SVG
         exports can all read one resolved value */
      line-height: 1;
      white-space: pre;
      tab-size: 1;
      scrollbar-width: thin;
    }
    #output:empty::before {
      content: var(--empty-art, '');
      display: block; padding: 20px 4px; color: var(--muted);
      font-family: Inter, system-ui, sans-serif; font-size: 13px; white-space: normal;
    }

    .stagefoot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #meta { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    #meta.over { color: var(--warn); }
    .stagefoot a { color: var(--muted); font-size: 12px; }

    /* click a preview to see it at full size */
    .inspect {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center; gap: 10px;
      padding: 24px;
      background: rgba(2, 12, 8, 0.88);
      cursor: zoom-out;
    }
    .inspect canvas { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 8px; background: #000; }
    .inspect p { margin: 0; color: var(--muted); font-size: 13px; }

    /* the offered variants */
    .offer { cursor: default; align-content: center; }
    .offer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(1500px, 96vw);
      height: min(86vh, 1000px);
    }
    .offer-tile {
      display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0;
      padding: 10px; border: 1px solid var(--line-strong); border-radius: 10px;
      background: var(--panel); color: var(--ink); font: inherit; text-align: left;
      cursor: pointer; overflow: hidden;
    }
    .offer-tile:focus-visible, .offer-tile:hover { border-color: var(--accent); }
    .offer-tile pre {
      margin: 0; flex: 1; min-height: 0; overflow: hidden;
      display: grid; place-content: center;
      font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Menlo, monospace;
      line-height: 1.05; white-space: pre; color: var(--ink);
    }
    .offer-tile .offer-name { font-size: 13px; }
    .offer-tile .offer-why { color: var(--muted); font-size: 12px; }

    /* drag and drop */
    body.dropping::after {
      content: var(--drop-hint, '');
      position: fixed; inset: 10px; z-index: 30;
      display: grid; place-items: center;
      border: 2px dashed var(--accent); border-radius: 14px;
      background: rgba(4, 36, 15, 0.55); color: var(--ink); font-size: 16px;
      pointer-events: none;
    }

    /* ------------------------------------------------------------------ *
     * Narrow screens cannot hold four panes at once, so there the page is
     * allowed to scroll and every layout collapses to one column.
     * ------------------------------------------------------------------ */
    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100dvh; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .sidebar { overflow: visible; max-height: none; }

      /* The result comes first here. The panel is longer than a phone screen,
         and in source order the art sat below all of it: you had to scroll
         past every control to see what the app had made. The order goes on
         .stage, not on .panes -- .stage is what the workspace grid actually
         holds, and order only reaches a container's own children. */
      .stage { order: -1; }

      /* The art across the top, the three source views as a thumbnail strip
         beneath it. They are for checking, not for reading, and at this width
         one full-size view each pushed the controls three screens down. */
      [data-layout] .panes {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: auto auto;
      }
      [data-layout] .panes .shot { grid-column: auto; grid-row: 2; }
      /* Same weight as the rule above, and after it: .panes .shot matches the
         art too, and the shorter selector lost to it. */
      [data-layout] .panes .shot-art { grid-column: 1 / -1; grid-row: 1; }
      .shot canvas { height: 96px; }
      #output { max-height: 52vh; }
    }

    /* On the narrowest screens the pixel counts in the thumbnail captions have
       nowhere to go and are cut off mid-number, which reads as breakage. The
       name alone is enough at 96px tall; the figures are still on the art. */
    @media (max-width: 560px) {
      .panes .shot:not(.shot-art) figcaption span { display: none; }
    }

    /* A landscape phone or a tablet: still one column, but wide enough that a
       single stack leaves every field stretched across the whole screen. */
    @media (min-width: 620px) and (max-width: 900px) {
      .sidebar { column-count: 2; column-gap: 18px; }
      .sidebar > * { break-inside: avoid; }
    }

    @media (max-height: 560px) {
      :root { --strip-h: 96px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#output" data-i18n="a11y.skip"></a>
  <div class="app" id="app" data-mode="simple" data-layout="grid" data-source="image">

    <header class="topbar">
      <div class="brand">Braille&nbsp;<span>Art</span>&nbsp;Generator</div>
      <div class="modes" role="group" data-i18n-label="mode.group">
        <button id="modeSimple" type="button" aria-pressed="true" data-i18n="mode.simple"></button>
        <button id="modeAdvanced" type="button" aria-pressed="false" data-i18n="mode.advanced"></button>
      </div>
      <label class="barfield" for="language"><span data-i18n="language.label"></span>
        <select id="language"></select>
      </label>
      <label class="barfield" for="layout"><span data-i18n="layout.label"></span>
        <select id="layout">
          <option value="grid" data-i18n="layout.grid"></option>
          <option value="strip" data-i18n="layout.strip"></option>
          <option value="focus" data-i18n="layout.focus"></option>
          <option value="row" data-i18n="layout.row"></option>
        </select>
      </label>
      <p id="status" class="grow" role="status" aria-live="polite"></p>
    </header>

    <div class="workspace">
      <aside class="sidebar">

        <div class="field">
          <label for="sourceKind" data-i18n="source.label"></label>
          <select id="sourceKind">
            <option value="image" data-i18n="source.image"></option>
            <option value="text" data-i18n="source.text"></option>
            <option value="camera" data-i18n="source.camera"></option>
            <option value="draw" data-i18n="source.draw"></option>
          </select>
        </div>

        <div data-when="image">
          <div class="field">
            <label for="file" data-i18n="source.file"></label>
            <input id="file" type="file" accept="image/*">
          </div>
        </div>

        <div data-when="text">
          <div class="field">
            <label for="textInput" data-i18n="text.label"></label>
            <textarea id="textInput" rows="2" spellcheck="false">BRAILLE</textarea>
          </div>
          <div class="field row">
            <div>
              <label for="textFont" data-i18n="text.font"></label>
              <select id="textFont"></select>
            </div>
            <div>
              <label data-i18n="text.weight"></label>
              <div class="check">
                <input id="textBold" type="checkbox" checked>
                <label for="textBold" data-i18n="text.bold"></label>
              </div>
            </div>
          </div>
        </div>

        <div data-when="camera">
          <div class="field buttons">
            <button id="cameraCapture" class="primary" type="button" data-i18n="camera.capture"></button>
          </div>
          <p class="hint" data-i18n="camera.hint"></p>
        </div>

        <div data-when="draw">
          <div class="field">
            <label for="brushSize" data-i18n="draw.brush"></label>
            <div class="slider">
              <input id="brushSize" type="range" min="2" max="60" value="18">
              <span class="readout" id="brushSizeVal">18</span>
            </div>
          </div>
          <div class="field buttons">
            <button id="brushErase" type="button" aria-pressed="false" data-i18n="draw.erase"></button>
            <button id="drawClear" type="button" data-i18n="draw.clear"></button>
          </div>
        </div>

        <div class="field buttons" data-when="image text camera">
          <button id="cropToggle" type="button" aria-pressed="false" data-i18n="crop.toggle"></button>
          <button id="cropReset" type="button" data-i18n="crop.reset"></button>
        </div>

        <div class="field">
          <label for="preset" data-i18n="preset.label"></label>
          <select id="preset"></select>
          <p class="hint" id="presetHint"></p>
        </div>

        <div class="field row">
          <div>
            <label for="outWidth" data-i18n="size.width"></label>
            <input id="outWidth" type="number" min="1" max="400" value="80">
          </div>
          <div data-advanced>
            <label for="outHeight" data-i18n="size.height"></label>
            <input id="outHeight" type="number" min="1" max="400" value="30">
          </div>
        </div>

        <div class="field check" data-advanced>
          <input id="keepAspect" type="checkbox" checked>
          <label for="keepAspect" data-i18n="size.keepAspect"></label>
        </div>

        <div class="field">
          <label for="threshold" data-i18n="threshold.label"></label>
          <div class="slider">
            <input id="threshold" type="range" min="0" max="255" value="128">
            <span class="readout" id="thresholdVal">128</span>
            <button id="autoThreshold" type="button" data-i18n-title="threshold.autoTitle" data-i18n="threshold.auto"></button>
          </div>
        </div>

        <div class="field">
          <label for="platform" data-i18n="platform.label"></label>
          <select id="platform"></select>
          <p class="hint" id="platformState"></p>
        </div>

        <div class="field check">
          <input id="trimBlank" type="checkbox">
          <label for="trimBlank" data-i18n="trim.label"></label>
        </div>

        <div class="field buttons">
          <button id="fitLimit" type="button" data-i18n="fit.label"></button>
        </div>

        <div class="field">
          <button id="calibrate" type="button" data-i18n="calibrate.open"></button>

          <div class="panel-inset" id="calibratePanel" hidden>
            <p class="hint" data-i18n="calibrate.explain"></p>
            <div class="ruler" id="rulerText"></div>
            <div class="buttons">
              <button id="copyRuler" type="button" data-i18n="calibrate.copyRuler"></button>
            </div>

            <div class="row" style="margin-top:11px">
              <div>
                <label for="calibratedWidth" data-i18n="calibrate.width"></label>
                <input id="calibratedWidth" type="number" min="4" max="400" value="40">
              </div>
              <div>
                <label for="calibratedScale" data-i18n="calibrate.scale"></label>
                <div class="slider">
                  <input id="calibratedScale" type="range" min="0.5" max="2" step="0.05" value="1">
                  <span class="readout" id="calibratedScaleVal">1.00</span>
                </div>
              </div>
            </div>
            <p class="hint" data-i18n="calibrate.scaleHint"></p>

            <div class="buttons" style="margin-top:11px">
              <button id="saveCalibration" class="primary" type="button" data-i18n="calibrate.save"></button>
              <button id="resetCalibration" type="button" data-i18n="calibrate.reset"></button>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="buttons">
            <button id="copy" class="primary" type="button" data-i18n="action.copy"></button>
            <button id="copyLink" type="button" data-i18n="action.link"></button>
            <button id="downloadTxt" type="button">.txt</button>
            <button id="downloadPng" type="button">PNG</button>
            <button id="downloadSvg" type="button" data-advanced>SVG</button>
            <button id="downloadHtml" type="button" data-advanced>HTML</button>
            <button id="downloadAnsi" type="button" data-advanced>ANSI</button>
            <button id="settingsUndo" type="button" disabled data-i18n="action.undo"></button>
            <button id="settingsRedo" type="button" disabled data-i18n="action.redo"></button>
            <button id="suggest" type="button" data-i18n="action.suggest"></button>
            <button id="generate" type="button" data-i18n="action.regenerate"></button>
          </div>
        </div>

        <div class="field buttons">
          <button id="dotEdit" type="button" aria-pressed="false" data-i18n="dots.edit"></button>
          <button id="dotUndo" type="button" disabled data-i18n="dots.undo"></button>
        </div>
        <p class="hint" id="dotHint"></p>

        <hr data-advanced>

        <div data-advanced>
          <p class="group-title" data-i18n="dither.group"></p>

          <div class="field check">
            <input id="colour" type="checkbox">
            <label for="colour" data-i18n="colour.label"></label>
          </div>

          <div class="field">
            <label for="palette" data-i18n="palette.label"></label>
            <select id="palette">
              <option value="full" data-i18n="palette.full" selected></option>
              <optgroup label="terminal" data-i18n-label="palette.terminal">
                <option value="ansi256" data-i18n="palette.ansi256"></option>
                <option value="ansi16" data-i18n="palette.ansi16"></option>
              </optgroup>
              <optgroup label="picture" data-i18n-label="palette.picture">
                <option value="picture8" data-i18n="palette.picture8"></option>
                <option value="picture4" data-i18n="palette.picture4"></option>
                <option value="picture2" data-i18n="palette.picture2"></option>
              </optgroup>
            </select>
            <p class="hint" data-i18n="palette.hint"></p>
          </div>

          <div class="field check">
            <input id="transparent" type="checkbox">
            <label for="transparent" data-i18n="export.transparent"></label>
          </div>

          <div class="field row">
            <div>
              <label for="dither" data-i18n="dither.label"></label>
              <select id="dither">
                <option value="floyd-steinberg" data-i18n="dither.floyd-steinberg"></option>
                <option value="atkinson" data-i18n="dither.atkinson"></option>
                <option value="bluenoise" data-i18n="dither.bluenoise"></option>
                <option value="bayer4" data-i18n="dither.bayer4"></option>
                <option value="sauvola" data-i18n="dither.sauvola"></option>
                <option value="threshold" data-i18n="dither.threshold"></option>
              </select>
            </div>
            <div>
              <label for="invert" data-i18n="invert.label"></label>
              <select id="invert">
                <option value="0" data-i18n="invert.no"></option>
                <option value="1" data-i18n="invert.yes"></option>
              </select>
            </div>
          </div>
        </div>

        <hr data-advanced>

        <div data-advanced>
          <p class="group-title" data-i18n="edges.group"></p>

          <div class="field" data-advanced>
            <label for="detail" data-i18n="detail.label"></label>
            <div class="slider">
              <input id="detail" type="range" min="0" max="100" value="35">
              <span class="readout" id="detailVal">35</span>
            </div>
            <p class="hint" data-i18n="detail.hint"></p>
          </div>

          <div class="field">
            <label for="edgeMode" data-i18n="edges.detector"></label>
            <select id="edgeMode">
              <option value="none" data-i18n="edges.none"></option>
              <option value="xdog" data-i18n="edges.xdog"></option>
              <option value="sobel" data-i18n="edges.sobel"></option>
            </select>
          </div>

          <div class="field">
            <label for="edgeAmount" data-i18n="edges.amount"></label>
            <div class="slider">
              <input id="edgeAmount" type="range" min="0" max="100" value="100" disabled>
              <span class="readout" id="edgeAmountVal">100</span>
            </div>
          </div>

          <div class="field">
            <label for="edgeRadius" data-i18n="edges.radius"></label>
            <div class="slider">
              <input id="edgeRadius" type="range" min="0.3" max="3" step="0.1" value="1.0" disabled>
              <span class="readout" id="edgeRadiusVal">1.0</span>
            </div>
          </div>

          <div class="field">
            <label for="edgeClean" data-i18n="edges.clean"></label>
            <div class="slider">
              <input id="edgeClean" type="range" min="0" max="100" value="90" disabled>
              <span class="readout" id="edgeCleanVal">90</span>
            </div>
            <p class="hint" data-i18n="edges.clean.hint"></p>
          </div>
        </div>

        <hr data-advanced>

        <div data-advanced>
          <p class="group-title" data-i18n="adjust.group"></p>

          <div class="field">
            <label for="brightness" data-i18n="adjust.brightness"></label>
            <div class="slider">
              <input id="brightness" type="range" min="-100" max="100" value="0">
              <span class="readout" id="brightnessVal">0</span>
            </div>
          </div>
          <div class="field">
            <label for="contrast" data-i18n="adjust.contrast"></label>
            <div class="slider">
              <input id="contrast" type="range" min="-100" max="100" value="0">
              <span class="readout" id="contrastVal">0</span>
            </div>
          </div>
          <div class="field">
            <label for="saturation" data-i18n="adjust.saturation"></label>
            <div class="slider">
              <input id="saturation" type="range" min="-100" max="100" value="0">
              <span class="readout" id="saturationVal">0</span>
            </div>
          </div>
          <div class="field">
            <label for="sharpness" data-i18n="adjust.sharpness"></label>
            <div class="slider">
              <input id="sharpness" type="range" min="0" max="5" step="0.1" value="0">
              <span class="readout" id="sharpnessVal">0.0</span>
            </div>
          </div>
        </div>

        <hr data-advanced>

        <div data-advanced>
          <p class="group-title" data-i18n="display.group"></p>

          <div class="field row">
            <div>
              <label for="fontSize" data-i18n="display.fontSize"></label>
              <input id="fontSize" type="number" min="6" max="48" value="12">
            </div>
            <div></div>
          </div>

          <div class="field buttons">
            <button id="resetEdits" type="button" data-i18n="reset.edits"></button>
            <button id="resetAll" type="button" data-i18n="reset.all"></button>
          </div>
        </div>

      </aside>

      <section class="stage">
        <div class="panes">
          <figure class="shot" tabindex="0" role="button" data-inspect="srcCanvas" data-i18n-label="pane.zoom.original">
            <figcaption><b data-i18n="pane.original"></b><span id="srcMeta"></span></figcaption>
            <div class="canvas-wrap">
              <canvas id="srcCanvas" width="360" height="240" data-when="image text camera"></canvas>
              <video id="camera" data-when="camera" playsinline muted></video>
              <canvas id="drawCanvas" data-when="draw" tabindex="0" data-i18n-label="draw.canvasLabel"></canvas>
              <div class="pad-cursor" id="padCursor" data-when="draw" hidden></div>
              <div class="cropper" id="cropper" hidden data-i18n-label="crop.overlayLabel"></div>
            </div>
          </figure>

          <figure class="shot" tabindex="0" role="button" data-inspect="editCanvas" data-i18n-label="pane.zoom.adjusted">
            <figcaption><b data-i18n="pane.adjusted"></b></figcaption>
            <canvas id="editCanvas" width="360" height="240"></canvas>
          </figure>

          <figure class="shot" tabindex="0" role="button" data-inspect="resCanvas" data-i18n-label="pane.zoom.grid">
            <figcaption><b data-i18n="pane.grid"></b><span id="gridMeta"></span></figcaption>
            <canvas id="resCanvas" width="160" height="120"></canvas>
          </figure>

          <figure class="shot shot-art">
            <figcaption><b data-i18n="pane.result"></b></figcaption>
            <pre id="output" tabindex="0" data-i18n-label="pane.result"></pre>
            <div class="dot-cursor" id="dotCursor" hidden></div>
          </figure>
        </div>

        <div class="stagefoot">
          <p id="meta"></p>
          <a href="https://github.com/Jareltis/Braille_Art_Generator"><span data-i18n="app.source"></span> · GPL-3.0-or-later</a>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
