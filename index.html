<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Braille Art Generator</title>
  <meta name="description" content="Генератор арта из символов Unicode Braille. Работает полностью в браузере.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>⣿</text></svg>">

  <style>
    :root {
      --bg: #083826;
      --bg-far: #0e4d35;
      --panel: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.09);
      --accent: #22c55e;
      --muted: #a7e9c9;
      --ink: #e6fff3;
      --art-bg: #00120a;
      --warn: #fbbf24;
      --error: #fca5a5;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--bg) linear-gradient(180deg, var(--bg) 0%, var(--bg-far) 100%) fixed;
      font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .wrap { max-width: 1300px; margin: 0 auto; padding: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }

    h1 { margin: 0 0 4px; font-size: 20px; }
    .tagline { margin: 0 0 18px; color: var(--muted); font-size: 13px; }

    .layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

    /* ---- controls ---- */
    .field { margin-bottom: 14px; }
    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 13px; }

    input[type="file"], input[type="number"], select {
      width: 100%;
      padding: 7px 9px;
      color: inherit;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
    }
    input[type="number"]:disabled { opacity: 0.5; cursor: not-allowed; }
    input[type="file"]::file-selector-button {
      margin-right: 10px; padding: 5px 10px; color: var(--ink);
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
      border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer;
    }

    .slider { display: flex; gap: 10px; align-items: center; }
    input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
    .readout {
      width: 52px; flex: none; text-align: center; color: var(--muted);
      font-size: 13px; font-variant-numeric: tabular-nums;
    }

    .slider button { flex: none; padding: 5px 10px; font-size: 13px; }

    .check { display: flex; gap: 8px; align-items: center; }
    .check input { accent-color: var(--accent); width: 16px; height: 16px; }
    .check label { margin: 0; }

    hr { margin: 18px 0; border: 0; border-top: 1px solid var(--line); }

    .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      padding: 8px 14px; color: var(--ink); background: transparent;
      border: 1px solid var(--line); border-radius: 8px;
      font: inherit; font-size: 14px; cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.07); }
    button.primary { color: #04240f; background: var(--accent); border-color: var(--accent); font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    #status { margin: 12px 0 0; font-size: 13px; color: var(--muted); min-height: 1.5em; }
    #status[data-kind="ok"] { color: var(--accent); }
    #status[data-kind="warn"] { color: var(--warn); }
    #status[data-kind="error"] { color: var(--error); }

    .hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; }

    /* ---- previews ---- */
    .stack { display: flex; flex-direction: column; gap: 16px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    canvas {
      display: block; max-width: 100%; height: auto;
      background: #000; border: 1px solid var(--line); border-radius: 8px;
    }
    /* the generator grid is tiny by design -- show the real pixels, not a blur */
    #resCanvas { image-rendering: pixelated; width: 100%; }

    #output {
      margin: 0; padding: 12px; overflow: auto;
      max-height: 70vh; min-height: 160px;
      color: var(--ink); background: var(--art-bg);
      border: 1px solid var(--line); border-radius: 8px;
      font-family: "Cascadia Mono", "DejaVu Sans Mono", "Segoe UI Symbol", monospace;
      /* line-height is a plain number so it resolves to px and the aspect-ratio
         maths, the layout and the PNG export can all read the same value */
      line-height: 1;
      white-space: pre;
      tab-size: 1;
    }
    #meta { margin: 8px 0 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

    footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <h1>Braille Art Generator</h1>
      <p class="tagline">Каждый символ кодирует блок 2×4 пикселя. Всё считается в браузере — изображение никуда не отправляется.</p>

      <div class="layout">
        <!-- ------------------------------ controls ------------------------------ -->
        <section aria-label="Параметры">
          <div class="field">
            <label for="file">Изображение</label>
            <input id="file" type="file" accept="image/*">
          </div>

          <div class="field row">
            <div>
              <label for="outWidth">Ширина, символов</label>
              <input id="outWidth" type="number" min="1" max="400" value="80">
            </div>
            <div>
              <label for="outHeight">Высота, символов</label>
              <input id="outHeight" type="number" min="1" max="400" value="30">
            </div>
          </div>

          <div class="field check">
            <input id="keepAspect" type="checkbox" checked>
            <label for="keepAspect">Сохранять пропорции (высота считается сама)</label>
          </div>

          <div class="field row">
            <div>
              <label for="dither">Метод</label>
              <select id="dither">
                <option value="floyd-steinberg">Флойд–Стейнберг</option>
                <option value="atkinson">Аткинсон</option>
                <option value="bayer4">Байер 4×4</option>
                <option value="threshold">Простой порог</option>
              </select>
            </div>
            <div>
              <label for="invert">Инверсия</label>
              <select id="invert">
                <option value="0">Нет</option>
                <option value="1">Да</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="threshold">Порог, 0–255</label>
            <div class="slider">
              <input id="threshold" type="range" min="0" max="255" value="128">
              <span class="readout" id="thresholdVal">128</span>
              <button id="autoThreshold" type="button" title="Подобрать порог методом Оцу">Авто</button>
            </div>
          </div>

          <hr>

          <div class="field">
            <label for="brightness">Яркость</label>
            <div class="slider">
              <input id="brightness" type="range" min="-100" max="100" value="0">
              <span class="readout" id="brightnessVal">0</span>
            </div>
          </div>
          <div class="field">
            <label for="contrast">Контраст</label>
            <div class="slider">
              <input id="contrast" type="range" min="-100" max="100" value="0">
              <span class="readout" id="contrastVal">0</span>
            </div>
          </div>
          <div class="field">
            <label for="saturation">Насыщенность</label>
            <div class="slider">
              <input id="saturation" type="range" min="-100" max="100" value="0">
              <span class="readout" id="saturationVal">0</span>
            </div>
          </div>
          <div class="field">
            <label for="sharpness">Резкость</label>
            <div class="slider">
              <input id="sharpness" type="range" min="0" max="5" step="0.1" value="0">
              <span class="readout" id="sharpnessVal">0.0</span>
            </div>
          </div>

          <hr>

          <div class="field row">
            <div>
              <label for="fontSize">Кегль вывода, px</label>
              <input id="fontSize" type="number" min="6" max="48" value="12">
            </div>
            <div></div>
          </div>

          <div class="buttons">
            <button id="generate" class="primary" type="button">Сгенерировать</button>
            <button id="copy" type="button">Копировать</button>
            <button id="downloadTxt" type="button">Скачать .txt</button>
            <button id="downloadPng" type="button">Скачать PNG</button>
            <button id="resetEdits" type="button">Сбросить коррекцию</button>
          </div>

          <p id="status" role="status" aria-live="polite"></p>
        </section>

        <!-- ------------------------------ previews ------------------------------ -->
        <section class="stack" aria-label="Предпросмотр и результат">
          <figure>
            <figcaption>Оригинал</figcaption>
            <canvas id="srcCanvas" width="360" height="240"></canvas>
          </figure>

          <figure>
            <figcaption>После коррекции</figcaption>
            <canvas id="editCanvas" width="360" height="240"></canvas>
          </figure>

          <figure>
            <figcaption>Пиксели, из которых считается арт</figcaption>
            <canvas id="resCanvas" width="160" height="120"></canvas>
          </figure>

          <figure>
            <figcaption>Результат</figcaption>
            <pre id="output" tabindex="0"></pre>
            <p id="meta"></p>
          </figure>
        </section>
      </div>

      <footer>
        <a href="https://github.com/Jareltis/Braille_Art_Generator">Исходный код</a> · GPL-3.0-or-later
      </footer>
    </main>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
