<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>index.html e2e</title></head>
<body>
<pre id="r">running</pre>
<iframe id="f" style="width:1280px;height:900px;border:0"></iframe>
<script>
// Registered before the module below, and separate from it on purpose: a module
// that fails to parse never runs its own handlers, and the run then dies as a
// bare timeout with nothing said. This turns that into a message.
window.addEventListener('error', (event) => {
  const where = event.filename ? ` at ${event.filename}:${event.lineno}` : '';
  fetch('/result', { method: 'POST', body: `THREW: ${event.message}${where}` });
});
window.addEventListener('unhandledrejection', (event) => {
  fetch('/result', { method: 'POST', body: `REJECTION: ${event.reason?.stack ?? event.reason}` });
});
</script>
<script type="module">
import { TERMINAL_PALETTES } from "../src/core/palette.js";
const log = [];
const out = (t) => {
  document.getElementById('r').textContent = t;
  fetch('/result', { method: 'POST', body: t });
};
const check = (name, got, want) => log.push(`${got === want ? 'PASS' : 'FAIL'}  ${name}: ${got}${got === want ? '' : ` (want ${want})`}`);
const ok = (name, cond, detail = '') => log.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? ': ' + detail : ''}`);

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = document.getElementById('f');

let reloads = 0;
async function reopen(fragment = '') {
  const loaded = new Promise((r) => frame.addEventListener('load', r, { once: true }));
  reloads += 1;
  frame.src = `../index.html?run=${reloads}${fragment}`;
  await loaded;
}

async function until(fn, timeout = 15000) {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    if (fn()) return true;
    await wait(100);
  }
  return false;
}

/**
 * Wait for a value to stop moving, and return it.
 *
 * A render arrives in more than one pass -- the row count is derived once the
 * image size is known, and the art is drawn again at the new grid -- so "there
 * is output" is not "the output is finished". Snapshots taken on the first
 * condition compare a half-finished art against a finished one and fail once in
 * a few runs.
 */
async function stable(read, timeout = 15000) {
  let previous = null;
  await until(() => {
    const now = read();
    const settled = now !== '' && now === previous;
    previous = now;
    return settled;
  }, timeout);
  return previous;
}

const started = Date.now();
const mark = (name) => {
  const line = `${name} at ${((Date.now() - started) / 1000).toFixed(1)}s`;
  log.push(`INFO  ${line}`);
  fetch('/progress', { method: 'POST', body: line });
};

async function run() {
  // The app remembers its settings now, and every test page shares this origin.
  // Start each run from a clean slate, or one run's preset leaks into the next.
  localStorage.clear();
  await reopen();
  const $ = (id) => frame.contentDocument.getElementById(id);

  await until(() => $('status').textContent.length > 0);
  // The language now follows the browser, and this one speaks English. Pin it,
  // so the assertions below can go on quoting the Russian wording.
  $('language').value = 'ru';
  $('language').dispatchEvent(new Event('change', { bubbles: true }));

  ok('page initialises', $('status').textContent.length > 0, $('status').textContent);
  check('a fresh page has nothing to step back to', $('settingsUndo').disabled, true);
  check('and nothing to step forward to', $('settingsRedo').disabled, true);
  ok('worker is in use on the real page', $('status').textContent.includes('фоновом потоке'));
  check('height field starts derived', $('outHeight').disabled, true);
  check('the default method is the one measured best', $('dither').value, 'ostromoukhov');

  // Build a 200x100 gradient and hand it to the real file input.
  const c = document.createElement('canvas');
  c.width = 200; c.height = 100;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 200, 100);
  grad.addColorStop(0, '#000'); grad.addColorStop(1, '#fff');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 200, 100);
  const blob = await new Promise((r) => c.toBlob(r, 'image/png'));

  const dt = new DataTransfer();
  dt.items.add(new File([blob], 'gradient.png', { type: 'image/png' }));
  $('file').files = dt.files;
  $('file').dispatchEvent(new Event('change', { bubbles: true }));

  // Nothing was clicked: the art must appear on its own.
  const appeared = await until(() => $('output').textContent.length > 0);
  ok('art generates automatically after load, with no click', appeared);

  const art = $('output').textContent;
  const lines = art.split('\n');
  check('width matches the field', lines[0].length, Number($('outWidth').value));
  check('height matches the field', lines.length, Number($('outHeight').value));
  // 200x100 source at 80 cols: rows follow the measured glyph aspect
  ok('rows derived from the 2:1 source', lines.length > 15 && lines.length < 30, `${lines.length} rows`);
  ok('meta line filled in', /символов/.test($('meta').textContent), $('meta').textContent);
  ok('output is real braille', /^[⠀-⣿]+$/.test(lines[0]));
  ok('gradient produced varied density', new Set(art.replace(/\n/g, '')).size > 10,
     `${new Set(art.replace(/\n/g, '')).size} distinct glyphs`);
  log.push(`INFO  row 8: ${lines[8].slice(0, 30)}`);

  // Changing a control must re-render without touching the button.
  const before = $('output').textContent;
  $('dither').value = 'bayer4';
  $('dither').dispatchEvent(new Event('change', { bubbles: true }));
  const changed = await until(() => $('output').textContent !== before);
  ok('switching method re-renders live', changed);
  log.push(`INFO  bayer4 row 8: ${$('output').textContent.split('\n')[8].slice(0, 30)}`);

  mark('edge controls');
  // --- edge controls -------------------------------------------------------
  const BLANK = String.fromCharCode(0x2800);
  const NEWLINE = String.fromCharCode(10);
  const inked = (text) => [...text.split(NEWLINE).join('')].filter((c) => c !== BLANK).length;

  check('line controls start disabled', $('edgeAmount').disabled && $('edgeRadius').disabled, true);

  const tonedInk = inked($('output').textContent);
  const beforeEdges = $('output').textContent;
  $('edgeMode').value = 'xdog';
  $('edgeMode').dispatchEvent(new Event('change', { bubbles: true }));

  check('choosing a detector enables the line controls',
    !$('edgeAmount').disabled && !$('edgeRadius').disabled, true);

  const redrew = await until(() => $('output').textContent !== beforeEdges);
  ok('switching to xdog re-renders live', redrew);

  const linedInk = inked($('output').textContent);
  ok('lines use fewer cells than tone', linedInk < tonedInk, `${linedInk} vs ${tonedInk} inked cells`);
  ok('lines are not empty', linedInk > 0, `${linedInk} inked cells`);

  // Dragging the mix back toward fill must bring the tone back.
  const pureLines = $('output').textContent;
  $('edgeAmount').value = '40';
  $('edgeAmount').dispatchEvent(new Event('input', { bubbles: true }));
  const mixed = await until(() => $('output').textContent !== pureLines);
  ok('the fill/line mix re-renders live', mixed);
  ok('mixing brings tone back', inked($('output').textContent) > linedInk,
     `${inked($('output').textContent)} inked cells at 40% lines`);

  $('edgeMode').value = 'sobel';
  $('edgeMode').dispatchEvent(new Event('change', { bubbles: true }));
  const sobelDrew = await until(() => inked($('output').textContent) > 0);
  ok('sobel also produces output', sobelDrew);

  // Auto threshold
  const beforeThreshold = $('threshold').value;
  $('autoThreshold').click();
  const picked = await until(() => $('threshold').value !== beforeThreshold || /подобран/.test($('status').textContent));
  ok('auto threshold responds', picked, `${beforeThreshold} -> ${$('threshold').value}`);

  // Preview canvases must have been painted at the source size
  check('source preview sized from the image', $('srcCanvas').width, 200);
  check('adjusted preview sized from the image', $('editCanvas').width, 200);
  ok('generator preview is the cell grid', $('resCanvas').width === Number($('outWidth').value) * 2,
     `${$('resCanvas').width}x${$('resCanvas').height}`);

  mark('presets');
  // --- presets -------------------------------------------------------------
  ok('preset list is populated from the module', $('preset').options.length >= 5,
     `${$('preset').options.length} options`);
  check('no preset is forced on first load', $('preset').value, '');

  const beforePreset = $('output').textContent;
  $('preset').value = 'lineart';
  $('preset').dispatchEvent(new Event('change', { bubbles: true }));
  ok('choosing a preset explains itself', $('presetHint').textContent.length > 0, $('presetHint').textContent);
  check('preset switched the detector on', $('edgeMode').value, 'xdog');
  check('preset switched dithering off', $('dither').value, 'threshold');
  check('preset moved the threshold', $('threshold').value, '40');
  ok('preset re-renders live', await until(() => $('output').textContent !== beforePreset));

  // Re-applying must land in the same place no matter what was touched between.
  $('contrast').value = '80';
  $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
  await until(() => $('contrast').value === '80');
  $('preset').value = 'lineart';
  $('preset').dispatchEvent(new Event('change', { bubbles: true }));
  check('re-applying a preset resets what it covers', $('contrast').value, '0');

  mark('platforms');
  // --- platforms -----------------------------------------------------------
  ok('platform list is populated from the module', $('platform').options.length >= 4,
     `${$('platform').options.length} options`);
  check('calibration is off until a target is chosen', $('calibrate').disabled, true);

  $('platform').value = 'discord';
  $('platform').dispatchEvent(new Event('change', { bubbles: true }));
  check('choosing a target enables calibration', $('calibrate').disabled, false);
  ok('an unmeasured target says so rather than inventing a width',
     /не измерена/.test($('platformState').textContent));
  // toLocaleString groups digits with a non-breaking space, so flatten before matching.
  const metaFlat = () => $('meta').textContent.split(String.fromCharCode(160)).join(' ');
  ok('the message limit shows up in the meta line',
     await until(() => metaFlat().includes('Discord: ') && metaFlat().includes('из 2 000')),
     metaFlat());

  mark('calibration');
  // --- calibration ---------------------------------------------------------
  check('calibration panel starts closed', $('calibratePanel').hidden, true);
  $('calibrate').click();
  check('calibration panel opens', $('calibratePanel').hidden, false);
  ok('a ruler is offered', $('rulerText').textContent.length > 50, `${$('rulerText').textContent.length} cells`);
  ok('the ruler is braille, not digits', /^[⠀-⣿]+$/.test($('rulerText').textContent));

  $('calibratedWidth').value = '36';
  $('calibratedScale').value = '1.2';
  $('calibratedScale').dispatchEvent(new Event('input', { bubbles: true }));
  $('saveCalibration').click();

  check('a measured width is applied to the output', $('outWidth').value, '36');
  ok('the measurement is reported back', /Измерено: 36/.test($('platformState').textContent),
     $('platformState').textContent);
  ok('the art follows the measured width',
     await until(() => $('output').textContent.split(String.fromCharCode(10))[0].length === 36),
     `${$('output').textContent.split(String.fromCharCode(10))[0].length} wide`);

  // A vertical scale above 1 must produce more rows than the same width at 1.
  const tallRows = $('output').textContent.split(String.fromCharCode(10)).length;
  $('resetCalibration').click();
  $('outWidth').value = '36';
  $('outWidth').dispatchEvent(new Event('input', { bubbles: true }));
  const plainRows = await until(() => $('output').textContent.split(String.fromCharCode(10)).length !== tallRows)
    ? $('output').textContent.split(String.fromCharCode(10)).length : tallRows;
  ok('vertical scale changes the row count', tallRows > plainRows, `${tallRows} scaled vs ${plainRows} plain`);
  ok('resetting forgets the measurement', /не измерена/.test($('platformState').textContent));

  mark('SVG');
  // --- SVG -----------------------------------------------------------------
  let svgFailed = null;
  frame.contentWindow.addEventListener('error', (e) => { svgFailed = e.message; });
  $('downloadSvg').click();
  await wait(300);
  check('SVG export does not throw', svgFailed, null);
  ok('SVG export reports success', /SVG/.test($('status').textContent), $('status').textContent);

  $('platform').value = 'none';
  $('platform').dispatchEvent(new Event('change', { bubbles: true }));

  mark('layout: the whole point of the redesign');
  // --- layout: the whole point of the redesign -----------------------------
  const PANES = ['srcCanvas', 'editCanvas', 'resCanvas', 'output'];
  const fitsViewport = () => {
    const win = frame.contentWindow;
    return PANES.every((id) => {
      const r = $(id).getBoundingClientRect();
      return r.width > 0 && r.height > 0
        && r.top >= -1 && r.left >= -1
        && r.bottom <= win.innerHeight + 1 && r.right <= win.innerWidth + 1;
    });
  };
  const paneSizes = () => PANES
    .map((id) => `${id.replace('Canvas', '')} ${Math.round($(id).getBoundingClientRect().height)}px`)
    .join(', ');

  ok('all four panes fit on screen at once', fitsViewport(), paneSizes());
  ok('the page itself does not scroll',
     $('output').ownerDocument.documentElement.scrollHeight <= frame.contentWindow.innerHeight + 1,
     `${$('output').ownerDocument.documentElement.scrollHeight}px of ${frame.contentWindow.innerHeight}px`);
  const paneHeight = (id) => $(id).getBoundingClientRect().height;
  const setLayout = async (name) => {
    $('layout').value = name;
    $('layout').dispatchEvent(new Event('change', { bubbles: true }));
    await wait(150);
  };

  check('2x2 is the default arrangement', $('app').dataset.layout, 'grid');
  ok('2x2 gives a preview real room instead of a thin strip',
     paneHeight('srcCanvas') > 200, `${Math.round(paneHeight('srcCanvas'))}px tall`);
  ok('2x2 shares the height evenly between art and previews',
     Math.abs(paneHeight('output') - paneHeight('srcCanvas')) < paneHeight('output') * 0.4,
     `art ${Math.round(paneHeight('output'))}px vs preview ${Math.round(paneHeight('srcCanvas'))}px`);

  for (const name of ['grid', 'strip', 'focus', 'row']) {
    await setLayout(name);
    ok(`layout "${name}" keeps all four panes on screen`, fitsViewport(), paneSizes());
  }

  await setLayout('focus');
  ok('the focus layout does hand the art the most room',
     paneHeight('output') > paneHeight('srcCanvas') * 2,
     `art ${Math.round(paneHeight('output'))}px vs preview ${Math.round(paneHeight('srcCanvas'))}px`);

  await setLayout('grid');
  ok('the controls column scrolls on its own instead of the page',
     $('file').closest('.sidebar').scrollHeight >= $('file').closest('.sidebar').clientHeight);

  // A laptop with a short screen must not break the promise either.
  frame.style.height = '620px';
  await wait(250);
  ok('four panes still fit a 620px-tall window', fitsViewport(), paneSizes());
  frame.style.height = '900px';
  await wait(250);

  mark('simple vs advanced');
  // --- simple vs advanced --------------------------------------------------
  const shown = (id) => $(id).offsetParent !== null;
  check('starts in simple mode', $('app').dataset.mode, 'simple');
  check('simple mode hides the dithering picker', shown('dither'), false);
  check('simple mode hides the edge detector', shown('edgeMode'), false);
  check('simple mode hides tone correction', shown('contrast'), false);
  check('simple mode keeps the file input', shown('file'), true);
  check('simple mode keeps presets', shown('preset'), true);
  check('simple mode keeps the threshold', shown('threshold'), true);
  check('simple mode keeps the target picker', shown('platform'), true);
  check('simple mode keeps copy', shown('copy'), true);

  $('modeAdvanced').click();
  check('advanced mode reveals dithering', shown('dither'), true);
  check('advanced mode reveals tone correction', shown('contrast'), true);
  check('advanced mode keeps the simple controls too', shown('threshold'), true);
  check('the switch reports its state', $('modeAdvanced').getAttribute('aria-pressed'), 'true');
  ok('all four panes still fit in advanced mode', fitsViewport(), paneSizes());

  mark('inspect overlay');
  // --- inspect overlay -----------------------------------------------------
  $('srcCanvas').closest('[data-inspect]').click();
  const overlay = frame.contentDocument.querySelector('.inspect');
  ok('clicking a preview opens it full size', overlay !== null);
  ok('the overlay draws the real pixels',
     overlay?.querySelector('canvas')?.width === $('srcCanvas').width,
     `${overlay?.querySelector('canvas')?.width}px`);
  overlay?.click();
  check('clicking again closes it', frame.contentDocument.querySelector('.inspect'), null);

  mark('the kind of picture is detected');
  // --- the kind of picture is detected --------------------------------------
  // Auto is not a preset but a way of choosing one, so what it must do is set
  // the same controls the chosen kind sets and say which kind it chose.
  {
    const strokes = async () => {
      const c = document.createElement('canvas');
      c.width = 240; c.height = 240;
      const cx = c.getContext('2d');
      cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, 240, 240);
      cx.strokeStyle = '#111111'; cx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        cx.beginPath();
        cx.moveTo(20 + i * 6, 30);
        cx.bezierCurveTo(190, 50 + i * 10, 40, 150 + i * 4, 220 - i * 5, 220);
        cx.stroke();
      }
      for (let i = 0; i < 30; i++) {
        cx.beginPath(); cx.moveTo(30, 40 + i * 3); cx.lineTo(100, 45 + i * 3); cx.stroke();
      }
      const b = await new Promise((r) => c.toBlob(r, 'image/png'));
      return new File([b], 'drawing.png', { type: 'image/png' });
    };

    // frame.contentWindow rather than the win binding declared further down:
    // this file is one long scope, and reaching forward into it is a dead zone.
    const page = frame.contentWindow;
    const dropped = new page.DataTransfer();
    dropped.items.add(await strokes());
    page.dispatchEvent(new page.DragEvent('drop', { dataTransfer: dropped, bubbles: true, cancelable: true }));
    ok('a drawing loads', await until(() => $('srcMeta').textContent === '240×240'),
       `srcMeta = ${$('srcMeta').textContent}`);

    $('preset').value = 'auto';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));

    const named = [...$('preset').options].find((option) => option.value === 'lineart').text;
    ok('it says which kind it settled on',
       await until(() => $('status').textContent.includes(named)), $('status').textContent);
    check('and sets the method that kind wants', $('dither').value, 'threshold');
    check('and its detector', $('edgeMode').value, 'xdog');
    // The choice on the dropdown is still auto: a kind was applied, not picked.
    check('the choice stays on auto', $('preset').value, 'auto');
    ok('and the hint explains auto, not the kind it found',
       $('presetHint').textContent.length > 0 && !$('presetHint').textContent.includes('XDoG'),
       $('presetHint').textContent);
  }

  mark('the art can be copied as a picture');
  // --- the art can be copied as a picture ----------------------------------
  // Braille survives most chats intact but not all: line height belongs to the
  // room, and a picture cannot be squashed by it. Whether the clipboard accepts
  // an image depends on the browser and on permissions, so what is checked here
  // is that the path runs and says which of the two happened -- silence would be
  // the real failure.
  {
    ok('the button is offered in simple mode too', $('copyImage').offsetParent !== null);

    // Nothing in flight, or the redraw that lands afterwards writes "Done." over
    // the answer this is waiting for -- a redraw started after a message is
    // entitled to replace it, and the heavier the line path gets the likelier
    // that is.
    await stable(() => $('output').textContent);

    let reached = false;
    $('copyImage').addEventListener('click', () => { reached = true; }, { once: true });
    $('copyImage').click();
    ok('pressing it reaches the handler', reached);

    // Three ways this can end, and every one of them speaks Russian here: the
    // picture is on the clipboard, the browser cannot do pictures, or the
    // browser refused. A raw engine message would be the app talking in a
    // language it has no dictionary for.
    ok('and it says so in the page language, whichever way it went',
       await until(() => /картинкой|не кладёт картинку|не дал странице/.test($('status').textContent), 6000),
       $('status').textContent);
  }

  mark('the art can be shared');
  // --- the art can be shared -----------------------------------------------
  // On a phone the chat is behind the share sheet rather than on the clipboard.
  // Whether the sheet opens depends on the browser and on a real tap, so what is
  // checked is that the path runs and says which of the ways it went -- in the
  // page's own language, as the clipboard path does.
  {
    if (typeof frame.contentWindow.navigator.share === 'function') {
      ok('the button is offered when the browser can share', !$('share').hidden);
      $('share').click();
      ok('and pressing it says what happened',
         await until(() => /ушёл|отменена|не умеет|не открыл/.test($('status').textContent), 6000),
         $('status').textContent);
    } else {
      ok('a browser that cannot share is not shown the button', $('share').hidden);
    }
  }

  mark('the art is drawn, not typeset');
  // --- the art is drawn, not typeset ---------------------------------------
  // A braille glyph inks about two thirds of the cell the font gives it, so the
  // typeset art arrives ruled with gutters that belong to the font rather than
  // to the picture. The page draws the dots over the text instead, on the same
  // lattice the exported picture uses. The text stays where it is -- it is what
  // gets copied, hand-edited and read out -- and gives up only its colour.
  {
    const drawn = $('lattice');
    const artView = $('output');
    const inFrame = frame.contentWindow;
    const transparent = 'rgba(0, 0, 0, 0)';

    check('the drawn copy is on by default', $('evenGrid').checked, true);
    ok('and the canvas is showing', await until(() => !drawn.hidden), `hidden=${drawn.hidden}`);
    check('the text has given up its colour', inFrame.getComputedStyle(artView).color, transparent);
    ok('the canvas covers the art',
       Math.abs(drawn.getBoundingClientRect().width - artView.clientWidth) < 2,
       `${drawn.getBoundingClientRect().width} over ${artView.clientWidth}`);
    ok('and it has pixels to draw into', drawn.width > 0 && drawn.height > 0, `${drawn.width}x${drawn.height}`);
    ok('while the art is still text underneath', /^[⠀-⣿]+$/.test(artView.textContent.split(NEWLINE)[0]));

    // A selection under an opaque canvas looks like a selection that failed.
    const picked = inFrame.getSelection();
    picked.selectAllChildren(artView);
    ok('a selection puts the canvas aside', await until(() => drawn.hidden, 3000), `hidden=${drawn.hidden}`);
    ok('so the highlight can be seen', inFrame.getComputedStyle(artView).color !== transparent);
    picked.removeAllRanges();
    ok('and letting go brings the drawing back', await until(() => !drawn.hidden, 3000));

    // Turned off, the page shows whatever the font makes of it.
    $('evenGrid').checked = false;
    $('evenGrid').dispatchEvent(new Event('change', { bubbles: true }));
    ok('turning it off hides the canvas', await until(() => drawn.hidden, 3000));
    ok('and the text is visible again', inFrame.getComputedStyle(artView).color !== transparent);
    ok('and the choice travels in the link',
       await until(() => /(^|[#&])eg=0([&]|$)/.test(inFrame.location.hash), 3000), inFrame.location.hash);

    $('evenGrid').checked = true;
    $('evenGrid').dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => !drawn.hidden);
  }

  mark('the art says what it is');
  // --- the art says what it is ---------------------------------------------
  // Left to itself a screen reader reads this element out as several thousand
  // braille patterns, one dot number after another. For an app that makes
  // pictures out of braille that is worse than unhelpful: the people who read
  // braille for real get the worst of it. So the art is a picture and says so.
  {
    const art = $('output');
    check('the art is presented as a picture', art.getAttribute('role'), 'img');

    const label = () => art.getAttribute('aria-label') ?? '';
    ok('and its description says how big it is', /\d+×\d+/.test(label()), label());
    ok('and where it came from', label().includes('источник'), label());
    ok('and how much of it there is', /знаков/.test(label()), label());

    // The numbers have to be this art, not the idea of one.
    const cols = Number($('outWidth').value);
    ok('the size in the description is the size on screen',
       label().includes(String(cols)), `${label()} (width field says ${cols})`);

    // While dots are being edited it is not a picture but a thing being worked
    // on, and the status line -- already a live region -- reports each change.
    $('dotEdit').click();
    await until(() => $('dotEdit').getAttribute('aria-pressed') === 'true');
    check('editing takes the picture role away', art.getAttribute('role'), null);
    ok('and the description says what the keys do', /Стрелки/.test(label()), label());

    $('dotEdit').click();
    await until(() => $('dotEdit').getAttribute('aria-pressed') === 'false');
    check('leaving editing gives it back', art.getAttribute('role'), 'img');

    // The status line is what carries the running commentary, so it has to be
    // a live region -- without that, an edit is silent.
    check('the status line is announced', $('status').getAttribute('aria-live'), 'polite');
  }

  mark('the panel says what it worked out');
  // --- the panel says what it worked out ------------------------------------
  // A lot is decided for the person now -- the kind of picture, the threshold,
  // whether a redraw still keeps up, what cleaning is doing -- and all of it
  // used to be announced once in the status line and then be gone.
  {
    const doc = frame.contentDocument;
    const rows = () => {
      const list = doc.querySelectorAll('#decidedList dt');
      return [...list].map((dt, i) => `${dt.textContent}: ${doc.querySelectorAll('#decidedList dd')[i].textContent}`);
    };

    ok('it lists what was decided', rows().length >= 4, rows().join(' | '));
    ok('including how the picture was sampled',
       rows().some((row) => /\d+×\d+/.test(row) && row.includes('ячее')), rows().join(' | '));
    ok('and whether redraws keep up',
       rows().some((row) => row.includes('мс') || row.includes('ничего')), rows().join(' | '));

    // Otsu and the hand are different answers and the panel says which it has.
    $('threshold').value = '96';
    $('threshold').dispatchEvent(new Event('input', { bubbles: true }));
    // Waiting for the number in the row that is about the threshold. Not for
    // the word alone -- it may already be there from whatever set the threshold
    // last -- and not for the number alone either, which is how this once
    // matched "last redraw 96 ms" and went on to compare a stale list.
    const thresholdRow = () => rows().find((row) => row.startsWith('Порог')) ?? '';
    await until(() => thresholdRow().includes('96'), 8000);
    ok('a threshold set by hand says so', thresholdRow().includes('96') && thresholdRow().includes('вручную'),
       rows().join(' | '));

    $('autoThreshold').click();
    ok('and one picked by Otsu says that instead',
       await until(() => rows().some((row) => row.includes('Оцу')), 8000), rows().join(' | '));

    // The kind of picture: chosen by hand, then worked out.
    $('preset').value = 'photo';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));
    ok('a preset chosen by hand is not claimed as a discovery',
       rows().some((row) => row.includes('вручную')), rows().join(' | '));
    // And the preset set the threshold, so Otsu must not be credited with it.
    ok('nor is a preset threshold credited to Otsu',
       !rows().some((row) => row.includes('Оцу')), rows().join(' | '));
    $('preset').value = 'auto';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));
    ok('and an automatic one is named',
       await until(() => rows().some((row) => row.includes('определён по картинке')), 8000), rows().join(' | '));

    // The two chords the panel advertises have to work.
    const chord = (key, extra = {}) => frame.contentWindow.dispatchEvent(
      new frame.contentWindow.KeyboardEvent('keydown', { key, ctrlKey: true, bubbles: true, ...extra }),
    );
    $('contrast').value = '25';
    $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
    await wait(200);
    // Watched at the buttons themselves: a status line that was going to change
    // anyway proves nothing about whether the chord arrived.
    let recalculated = false;
    let copied = false;
    $('generate').addEventListener('click', () => { recalculated = true; }, { once: true });
    $('copy').addEventListener('click', () => { copied = true; }, { once: true });

    chord('Enter');
    ok('ctrl+enter reaches recalculate', recalculated);
    chord('c', { shiftKey: true });
    ok('ctrl+shift+c reaches copy', copied);

    // And the plain chord is left alone, so copying out of a text box still works.
    let hijacked = false;
    $('copy').addEventListener('click', () => { hijacked = true; }, { once: true });
    chord('c');
    ok('plain ctrl+c is left to the browser', !hijacked);
  }

  mark('a burst of changes settles on the last one');
  // --- a burst of changes settles on the last one --------------------------
  // Coalescing by animation frame merges the events of one frame and then lets
  // the next frame start another redraw whether or not the last has finished.
  // Dragging therefore queued one redraw per frame, each computed in full and
  // then thrown away as stale, and the art landed long after the hand stopped.
  // What has to be true either way is that the picture on screen belongs to the
  // last setting, so that is what is checked.
  {
    // "Done." is a poor sign that a redraw has finished: it is already on the
    // status line from the last one, so waiting for it can return while the
    // next render is still in the worker -- which is how this test came to
    // compare a half-finished art against a finished one once the line path
    // grew heavier. Wait for the art itself to stop moving as well.
    const settle = async () => {
      await until(() => $('status').textContent.includes('Готово'), 10000);
      // And then give a redraw that has only just been asked for time to start:
      // the request rides a coalesced frame, so at this instant the art can be
      // sitting perfectly still with the next one not yet begun.
      await wait(300);
      return stable(() => $('output').textContent);
    };

    $('contrast').value = '60';
    $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
    const alone = await settle();

    // Walk it away and back in a hurry, ending where it started.
    $('contrast').value = '0';
    $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
    await settle();

    const started = Date.now();
    for (let step = 0; step <= 25; step++) {
      $('contrast').value = String(step === 25 ? 60 : step * 2);
      $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
      await wait(12);
    }
    const afterBurst = await settle();
    mark(`the burst settled in ${Date.now() - started}ms`);

    check('the art on screen is the last setting, not a stale one', afterBurst === alone, true);
    check('and the panel agrees', $('contrast').value, '60');

    $('contrast').value = '0';
    $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
    await settle();
  }

  mark('colour can be cut to a palette');
  // --- colour can be cut to a palette --------------------------------------
  // One control, one code path: whatever the palette is, the cells are snapped
  // to it before anything downstream sees them, so the screen, the HTML, the
  // PNG and the terminal cannot disagree about what colour a cell is.
  {
    const doc = frame.contentDocument;
    $('colour').checked = true;
    $('colour').dispatchEvent(new Event('change', { bubbles: true }));
    const shades = () => new Set([...doc.querySelectorAll('#output span')].map((span) => span.style.color));
    ok('colour arrives', await until(() => shades().size > 0), `${shades().size} shades`);
    const fullColour = shades().size;

    const choose = async (value, settled) => {
      $('palette').value = value;
      $('palette').dispatchEvent(new Event('change', { bubbles: true }));
      return until(settled, 8000);
    };

    ok('four colours means four colours', await choose('picture4', () => shades().size > 0 && shades().size <= 4),
       `${shades().size} shades`);
    ok('and full colour had more to say than that', fullColour > 4, `${fullColour} shades`);

    // Every cell must land on a real terminal entry, not near one.
    const known = new Set();
    for (let i = 0; i * 3 < TERMINAL_PALETTES.ansi16.length; i++) {
      known.add(`rgb(${TERMINAL_PALETTES.ansi16[i * 3]}, ${TERMINAL_PALETTES.ansi16[i * 3 + 1]}, ${TERMINAL_PALETTES.ansi16[i * 3 + 2]})`);
    }
    await choose('ansi16', () => shades().size > 0 && [...shades()].every((shade) => known.has(shade)));
    const strays = [...shades()].filter((shade) => !known.has(shade));
    check('sixteen colours means the sixteen a terminal has', strays.join(' '), '');

    await choose('full', () => shades().size > 4);
    ok('and full colour comes back', shades().size > 4, `${shades().size} shades`);

    // A transparent background is an export setting, so it travels like one.
    const before = frame.contentWindow.location.hash;
    $('transparent').checked = true;
    $('transparent').dispatchEvent(new Event('change', { bubbles: true }));
    ok('a transparent background is remembered in the link',
       await until(() => frame.contentWindow.location.hash !== before), frame.contentWindow.location.hash.slice(0, 40));
    $('transparent').checked = false;
    $('transparent').dispatchEvent(new Event('change', { bubbles: true }));
    $('colour').checked = false;
    $('colour').dispatchEvent(new Event('change', { bubbles: true }));
    await wait(200);
  }

  mark('a phone puts the result first');
  // --- a phone puts the result first ---------------------------------------
  // Below 900px the page gives up on holding everything at once and scrolls,
  // which is fine. What was not fine is that it scrolled in source order, so
  // the art sat below the whole control panel: on a phone you had to go past
  // every control to see what the app had made.
  {
    const doc = frame.contentDocument;
    const wide = { width: frame.style.width, height: frame.style.height };
    const resize = async (width, height) => {
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      await wait(300);
    };

    await resize(390, 844);
    const top = (selector) => doc.querySelector(selector).getBoundingClientRect().top;
    const box = (selector) => doc.querySelector(selector).getBoundingClientRect();

    ok('the art comes before the controls', top('.shot-art') < top('.sidebar'),
       `art at ${Math.round(top('.shot-art'))}px, panel at ${Math.round(top('.sidebar'))}px`);
    ok('and it is the first thing on the page after the header',
       top('.shot-art') < frame.contentWindow.innerHeight / 2,
       `${Math.round(top('.shot-art'))}px down a ${frame.contentWindow.innerHeight}px screen`);

    // The three source views become a strip under it rather than three more
    // full-height panes, which is what pushed the controls three screens down.
    const sources = [...doc.querySelectorAll('.panes .shot:not(.shot-art)')];
    check('the three source views are still there', sources.length, 3);
    ok('they sit side by side on one row',
       sources.every((shot) => Math.abs(shot.getBoundingClientRect().top - sources[0].getBoundingClientRect().top) < 2),
       sources.map((shot) => Math.round(shot.getBoundingClientRect().top)).join(', '));
    ok('and below the art, not beside it',
       sources[0].getBoundingClientRect().top >= box('.shot-art').bottom - 2,
       `strip at ${Math.round(sources[0].getBoundingClientRect().top)}px, art ends at ${Math.round(box('.shot-art').bottom)}px`);
    ok('the art is wider than any one of them',
       box('.shot-art').width > sources[0].getBoundingClientRect().width * 2,
       `${Math.round(box('.shot-art').width)}px against ${Math.round(sources[0].getBoundingClientRect().width)}px`);

    // And what you do with the art is next to the art rather than halfway down
    // the settings. It used to live in the panel, which on this screen put the
    // first thing anyone wants -- copying -- about 1700px down.
    ok('the action bar belongs to the art, not to the panel',
       doc.querySelector('.stage .actions') !== null && doc.querySelector('.sidebar .actions') === null);
    ok('copying is on the first screen', box('#copy').bottom < frame.contentWindow.innerHeight,
       `copy ends at ${Math.round(box('#copy').bottom)}px of ${frame.contentWindow.innerHeight}px`);
    ok('and it comes after the art rather than before it',
       box('#copy').top > box('.shot-art').top,
       `copy at ${Math.round(box('#copy').top)}px, art at ${Math.round(box('.shot-art').top)}px`);
    ok('the answer to pressing it is next to it',
       Math.abs(box('#status').top - box('#copy').bottom) < 200,
       `status at ${Math.round(box('#status').top)}px, button ends at ${Math.round(box('#copy').bottom)}px`);

    // The two screens where this last fell over, measured rather than guessed:
    // a phone held sideways and a small or folded one. Both had the button
    // below the fold, which is exactly what the arrangement exists to prevent.
    for (const [width, height, what] of [[320, 568, 'a small phone'], [844, 390, 'a phone held sideways']]) {
      await resize(width, height);
      const inner = frame.contentWindow;
      ok(`${what}: copying is still on the first screen`,
         box('#copy').bottom <= inner.innerHeight,
         `copy ends at ${Math.round(box('#copy').bottom)}px of ${inner.innerHeight}px`);
      ok(`${what}: and nothing runs off the side`,
         doc.documentElement.scrollWidth <= inner.innerWidth + 2,
         `${doc.documentElement.scrollWidth}px wide in ${inner.innerWidth}px`);
      ok(`${what}: the art is still the tallest thing above it`,
         box('.shot-art').height > box('.panes .shot:not(.shot-art)').height,
         `art ${Math.round(box('.shot-art').height)}px against strip ${Math.round(box('.panes .shot:not(.shot-art)').height)}px`);
    }

    // Wide enough for two columns of controls, narrow enough to still be one
    // stack: a landscape phone should not stretch every field across 844px.
    await resize(844, 390);
    const fields = [...doc.querySelectorAll('.sidebar .field')].slice(0, 12);
    const columns = new Set(fields.map((field) => Math.round(field.getBoundingClientRect().left)));
    ok('a landscape phone lays the controls out in more than one column', columns.size >= 2,
       `${columns.size} column positions among ${fields.length} fields`);

    await resize(Number.parseInt(wide.width, 10) || 1280, Number.parseInt(wide.height, 10) || 900);
    ok('and the wide layout comes back', top('.sidebar') < top('.shot-art') + 1,
       `panel at ${Math.round(top('.sidebar'))}px, art at ${Math.round(top('.shot-art'))}px`);
  }

  mark('the panel can be stepped back');
  // --- the panel can be stepped back ---------------------------------------
  // Presets, the kind detector and the offered variants all rewrite several
  // controls at once. Stepping back is the only way to see what was there
  // before them, and stepping back and forward is how one art is compared
  // against another.
  {
    const doc = frame.contentDocument;
    $('preset').value = '';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));
    $('contrast').value = '41';
    $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
    $('dither').value = 'bluenoise';
    $('dither').dispatchEvent(new Event('change', { bubbles: true }));
    await wait(150);

    // Earlier blocks have already picked presets, so there is a history by now.
    check('there is something to step back to', $('settingsUndo').disabled, false);

    $('preset').value = 'lineart';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));
    check('a preset moves several controls at once', $('dither').value, 'threshold');

    $('settingsUndo').click();
    check('back restores the method', $('dither').value, 'bluenoise');
    check('and the slider', $('contrast').value, '41');
    ok('and says so', $('status').textContent.length > 0, $('status').textContent);

    $('settingsRedo').click();
    check('forward puts the preset back', $('dither').value, 'threshold');
    check('and forward is then spent', $('settingsRedo').disabled, true);

    // A fresh change closes off the branch that was stepped away from.
    $('settingsUndo').click();
    $('saturation').value = '15';
    $('saturation').dispatchEvent(new Event('input', { bubbles: true }));
    $('preset').value = 'photo';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));
    check('a new change drops what was ahead', $('settingsRedo').disabled, true);

    // Ctrl+Z belongs to the dots while dots are being edited, and to the panel
    // otherwise. Both have to hold, or one of them is unreachable.
    const chord = (extra = {}) => frame.contentWindow.dispatchEvent(
      new frame.contentWindow.KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true, ...extra }),
    );
    const beforeChord = $('dither').value;
    chord();
    ok('the chord steps the panel back', $('dither').value !== beforeChord,
       `${beforeChord} -> ${$('dither').value}`);
    chord({ shiftKey: true });
    check('and with shift, forward again', $('dither').value, beforeChord);

    $('dotEdit').click();
    await until(() => $('dotEdit').getAttribute('aria-pressed') === 'true');
    const whileEditing = $('dither').value;
    chord();
    check('while editing dots the chord leaves the panel alone', $('dither').value, whileEditing);
    $('dotEdit').click();
    await until(() => $('dotEdit').getAttribute('aria-pressed') === 'false');
  }

  mark('variants are offered');
  // --- variants are offered -------------------------------------------------
  // The offer has to be an offer: shown, refusable, and applied only when one
  // is taken. Escape must leave the panel exactly as it found it.
  {
    const doc = frame.contentDocument;
    let wantedText = '';
    const before = {
      dither: $('dither').value, detail: $('detail').value,
      edge: $('edgeMode').value, status: $('status').textContent,
    };

    // Focused first, because that is what pressing a button does and what the
    // returning focus has to find. A bare .click() leaves focus on the body,
    // which quietly turns the focus check below into a check of nothing.
    $('suggest').focus();
    $('suggest').click();
    ok('the dialog opens', await until(() => doc.querySelector('.offer') !== null),
       $('status').textContent);

    const tiles = () => [...doc.querySelectorAll('.offer-tile')];
    check('four variants are on the table', tiles().length, 4);
    ok('each tile shows the art itself',
       tiles().every((tile) => (tile.querySelector('pre')?.textContent ?? '').length > 0));
    ok('each tile says how close it is',
       tiles().every((tile) => /\d+%/.test(tile.querySelector('.offer-why')?.textContent ?? '')),
       tiles()[0]?.querySelector('.offer-why')?.textContent);

    // And what taking it would change, in the words on the panel rather than
    // in the names of the settings behind them.
    const explains = (tile) => [...tile.querySelectorAll('.offer-why')].map((n) => n.textContent).join(' | ');
    ok('each tile says what it would change',
       tiles().every((tile) => /меняет|текущие настройки/.test(explains(tile))),
       explains(tiles()[0]));
    check('the first is focused', doc.activeElement, tiles()[0]);

    // Arrows walk the grid: right by one, down by two.
    doc.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    check('right moves along the row', doc.activeElement, tiles()[1]);
    doc.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
    check('down moves to the next row', doc.activeElement, tiles()[3]);

    // Escape changes nothing.
    doc.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    ok('escape closes it', await until(() => doc.querySelector('.offer') === null));
    check('and the method is untouched', $('dither').value, before.dither);
    check('and the detail is untouched', $('detail').value, before.detail);
    check('and the detector is untouched', $('edgeMode').value, before.edge);
    check('focus returns to the button', doc.activeElement, $('suggest'));
    ok('and the panel says what it said before', $('status').textContent === before.status,
       `${$('status').textContent} (was ${before.status})`);

    // Taking one applies it.
    $('suggest').focus();
    $('suggest').click();
    await until(() => doc.querySelector('.offer') !== null);
    const wanted = [...doc.querySelectorAll('.offer-tile')].find(
      (tile) => tile.querySelector('pre').textContent !== $('output').textContent,
    ) ?? doc.querySelector('.offer-tile');
    const named = wanted.querySelector('.offer-name').textContent;
    wanted.click();
    const promised = wanted.querySelector('pre').textContent;
    wantedText = promised;
    ok('choosing closes the dialog', await until(() => doc.querySelector('.offer') === null));
    ok('and says which one was taken',
       await until(() => $('status').textContent.includes(named)), $('status').textContent);

    // The whole promise of the offer: the tile is the art, not an impression of
    // it. This caught a units mistake -- recipes carry detail in the units of
    // the slider, the encoder wants a fraction -- that rendered every tile at a
    // strength of 35 instead of 0.35, so choosing one produced a different
    // picture from the one on it.
    ok('and the art is the one that was on the tile',
       await until(() => $('output').textContent === promised),
       `${$('output').textContent.length} characters against the tile's ${promised.length}`);

    // The tiles are meant to be looked at, so the art has to fill them rather
    // than sit in a corner at a fixed few pixels.
    $('suggest').focus();
    $('suggest').click();
    await until(() => doc.querySelector('.offer') !== null);
    const shown = doc.querySelector('.offer-tile pre');
    const room = shown.getBoundingClientRect();
    ok('the art fills the tile it is shown in',
       shown.scrollWidth > room.width * 0.8 || shown.scrollHeight > room.height * 0.8,
       `art ${shown.scrollWidth}x${shown.scrollHeight} in ${Math.round(room.width)}x${Math.round(room.height)}`);
    ok('and is drawn large enough to read', Number.parseFloat(shown.style.fontSize) > 7,
       shown.style.fontSize);
    doc.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await until(() => doc.querySelector('.offer') === null);
  }

  mark('every setting travels');
  // --- every setting travels ----------------------------------------------
  // A control that changes the art has to reach the link, or a shared recipe
  // arrives incomplete. The detail slider did not, from the version that
  // introduced it until this test was written: it was saved to storage and
  // quietly left out of the fragment, so the link rendered something else on
  // the other end. Checked by moving each control rather than by comparing two
  // lists, which is what let the two lists drift apart in the first place.
  {
    $('edgeMode').value = 'xdog';
    $('edgeMode').dispatchEvent(new Event('change', { bubbles: true }));

    // brushSize belongs to the drawing tool and calibratedScale to the
    // platform ruler; neither describes the art, and neither is in the link on
    // purpose.
    const settings = ['threshold', 'detail', 'edgeAmount', 'edgeRadius', 'edgeClean',
                      'brightness', 'contrast', 'saturation', 'sharpness'];
    const missing = [];
    for (const id of settings) {
      const input = $(id);
      const was = frame.contentWindow.location.hash;
      const step = Number(input.step) || 1;
      const moved = Number(input.value) === Number(input.max)
        ? Number(input.value) - step
        : Number(input.value) + step;
      input.value = String(moved);
      input.dispatchEvent(new Event('input', { bubbles: true }));
      if (!await until(() => frame.contentWindow.location.hash !== was, 3000)) missing.push(id);
    }
    ok('every control that changes the art is in the link', missing.length === 0,
       missing.length ? `left out: ${missing.join(', ')}` : `${settings.length} controls`);

    $('edgeMode').value = 'none';
    $('edgeMode').dispatchEvent(new Event('change', { bubbles: true }));
  }

  mark('settings survive a reload');
  // --- settings survive a reload ------------------------------------------
  $('contrast').value = '33';
  $('contrast').dispatchEvent(new Event('input', { bubbles: true }));
  $('dither').value = 'atkinson';
  $('dither').dispatchEvent(new Event('change', { bubbles: true }));
  await setLayout('focus');
  await wait(400);

  await reopen();
  await until(() => $('status').textContent.length > 0);

  check('the mode is remembered', $('app').dataset.mode, 'advanced');
  check('a slider value is remembered', $('contrast').value, '33');
  check('a dropdown value is remembered', $('dither').value, 'atkinson');
  check('the chosen layout is remembered', $('app').dataset.layout, 'focus');

  mark('dropping and pasting');
  // --- dropping and pasting ------------------------------------------------
  const makeFile = async (w, h, name) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cx = c.getContext('2d');
    cx.fillStyle = '#333'; cx.fillRect(0, 0, w, h);
    cx.fillStyle = '#eee'; cx.fillRect(0, 0, w / 2, h);
    const b = await new Promise((r) => c.toBlob(r, 'image/png'));
    return new File([b], name, { type: 'image/png' });
  };
  const win = frame.contentWindow;

  const dropped = new win.DataTransfer();
  dropped.items.add(await makeFile(120, 60, 'dropped.png'));
  win.dispatchEvent(new win.DragEvent('drop', { dataTransfer: dropped, bubbles: true, cancelable: true }));
  ok('a dropped image loads', await until(() => $('srcMeta').textContent === '120×60'),
     `srcMeta = ${$('srcMeta').textContent}`);

  const pasted = new win.DataTransfer();
  pasted.items.add(await makeFile(90, 30, 'pasted.png'));
  win.dispatchEvent(new win.ClipboardEvent('paste', { clipboardData: pasted, bubbles: true, cancelable: true }));
  ok('a pasted image loads', await until(() => $('srcMeta').textContent === '90×30'),
     `srcMeta = ${$('srcMeta').textContent}`);

  // Awaited, not read straight away: the caption is filled in when the render
  // lands, which is a moment after the image itself is in.
  ok('the grid caption reports the sampled size',
     await until(() => /\d+×\d+/.test($('gridMeta').textContent)), $('gridMeta').textContent);

  mark('reset');
  // --- reset ---------------------------------------------------------------
  $('modeAdvanced').click();
  $('resetAll').click();
  await wait(200);
  check('reset returns the contrast to zero', $('contrast').value, '0');
  check('reset returns the method to the default', $('dither').value, 'ostromoukhov');
  check('reset returns the layout to 2x2', $('app').dataset.layout, 'grid');

  mark('cropping');
  // --- cropping ------------------------------------------------------------
  // A wide source, so cropping to a square changes the row count visibly.
  const wide = new win.DataTransfer();
  wide.items.add(await makeFile(400, 200, 'wide.png'));
  win.dispatchEvent(new win.DragEvent('drop', { dataTransfer: wide, bubbles: true, cancelable: true }));
  await until(() => $('srcMeta').textContent === '400×200');
  await until(() => $('output').textContent.length > 0);

  const rowsBefore = $('output').textContent.split(String.fromCharCode(10)).length;

  check('the crop overlay is hidden until asked for', $('cropper').hidden, true);
  check('the crop button starts unpressed', $('cropToggle').getAttribute('aria-pressed'), 'false');
  $('cropToggle').click();
  check('the crop button reports being on', $('cropToggle').getAttribute('aria-pressed'), 'true');
  check('the crop overlay appears', $('cropper').hidden, false);

  // Where the bitmap actually sits inside its box -- object-fit letterboxes it,
  // so pointer coordinates have to be measured against the picture.
  const picture = () => {
    const canvas = $('srcCanvas');
    const box = canvas.getBoundingClientRect();
    const ratio = canvas.width / canvas.height;
    const w = box.width / box.height > ratio ? box.height * ratio : box.width;
    const h = box.width / box.height > ratio ? box.height : box.width / ratio;
    return { left: box.left + (box.width - w) / 2, top: box.top + (box.height - h) / 2, w, h };
  };

  const drag = async (fromX, fromY, toX, toY) => {
    const area = picture();
    const at = (fx, fy) => ({
      clientX: area.left + area.w * fx,
      clientY: area.top + area.h * fy,
      pointerId: 1,
      button: 0,
      bubbles: true,
      cancelable: true,
    });
    const overlay = $('cropper');
    overlay.dispatchEvent(new win.PointerEvent('pointerdown', at(fromX, fromY)));
    overlay.dispatchEvent(new win.PointerEvent('pointermove', at(toX, toY)));
    overlay.dispatchEvent(new win.PointerEvent('pointerup', at(toX, toY)));
    await wait(250);
  };

  // Take a tall slice of the left side. The start point is kept clear of the
  // corners: within the handle grab radius a drag means "resize", not "draw".
  await drag(0.02, 0.20, 0.48, 0.98);

  await until(() => $('output').textContent.split(String.fromCharCode(10)).length !== rowsBefore);
  const rowsCropped = $('output').textContent.split(String.fromCharCode(10)).length;
  ok('cropping to a taller shape adds rows', rowsCropped > rowsBefore * 1.4,
     `${rowsBefore} rows before, ${rowsCropped} after`);

  ok('the grid is sampled at the cropped shape',
     /^(\d+)×(\d+)$/.test($('gridMeta').textContent), $('gridMeta').textContent);

  $('cropReset').click();
  const rowsRestored = await until(() =>
    $('output').textContent.split(String.fromCharCode(10)).length === rowsBefore)
    ? rowsBefore
    : $('output').textContent.split(String.fromCharCode(10)).length;
  check('taking the whole frame restores the shape', rowsRestored, rowsBefore);

  // A click without a drag must not select a sliver of nothing.
  await drag(0.4, 0.4, 0.4, 0.4);
  check('a bare click keeps the whole frame',
    $('output').textContent.split(String.fromCharCode(10)).length, rowsBefore);

  $('cropToggle').click();
  check('the overlay closes again', $('cropper').hidden, true);

  mark('offline shell');
  // --- offline shell -------------------------------------------------------
  ok('the page declares a manifest',
     frame.contentDocument.querySelector('link[rel="manifest"]') !== null);
  ok('the page declares a theme colour',
     frame.contentDocument.querySelector('meta[name="theme-color"]') !== null);
  // Registering from a frame would scope a worker to a page that is not the
  // app, so the guard must hold here.
  check('no service worker is registered from inside a frame',
    (await win.navigator.serviceWorker?.getRegistrations?.() ?? []).length, 0);

  mark('editing dots by hand');
  // --- editing dots by hand ------------------------------------------------
  const artLines = () => $('output').textContent.split(String.fromCharCode(10));
  const cellAt = (row, col) => artLines()[row].charCodeAt(col) - 0x2800;

  // Resolve a cell to a screen position with the same metrics the app uses, so
  // the test clicks where the glyph actually is rather than where it guesses.
  const probe = frame.contentDocument.createElement('canvas').getContext('2d');
  const artStyle = () => win.getComputedStyle($('output'));
  const pointAt = (row, col, fx, fy) => {
    const style = artStyle();
    probe.font = `${style.fontSize} ${style.fontFamily}`;
    const advance = probe.measureText(String.fromCharCode(0x28FF)).width;
    const lineHeight = Number.parseFloat(style.lineHeight);
    const box = $('output').getBoundingClientRect();
    return {
      clientX: box.left + Number.parseFloat(style.paddingLeft) + (col + fx) * advance - $('output').scrollLeft,
      clientY: box.top + Number.parseFloat(style.paddingTop) + (row + fy) * lineHeight - $('output').scrollTop,
      pointerId: 7,
      button: 0,
      bubbles: true,
      cancelable: true,
    };
  };
  const poke = async (row, col, fx, fy) => {
    const target = $('output');
    target.dispatchEvent(new win.PointerEvent('pointerdown', pointAt(row, col, fx, fy)));
    target.dispatchEvent(new win.PointerEvent('pointerup', pointAt(row, col, fx, fy)));
    await wait(60);
  };

  check('editing is off to begin with', $('dotEdit').getAttribute('aria-pressed'), 'false');
  check('undo starts unavailable', $('dotUndo').disabled, true);

  $('dotEdit').click();
  check('the edit button reports being on', $('dotEdit').getAttribute('aria-pressed'), 'true');
  ok('the app marks itself as editing', $('app').classList.contains('editing'));
  ok('the mode explains itself', $('dotHint').textContent.length > 0);

  // Top-left dot of a cell: fraction 0.25 across, 0.1 down.
  const maskBefore = cellAt(2, 3);
  await poke(2, 3, 0.25, 0.1);
  const maskAfter = cellAt(2, 3);
  ok('clicking flips exactly one dot', (maskBefore ^ maskAfter) === 1,
     `mask ${maskBefore} -> ${maskAfter}`);
  check('undo becomes available', $('dotUndo').disabled, false);

  // A different dot of the same cell must be independent.
  const beforeSecond = cellAt(2, 3);
  await poke(2, 3, 0.75, 0.9);   // right column, bottom row = dot 8 = bit 7
  ok('a second dot in the same cell flips on its own', (beforeSecond ^ cellAt(2, 3)) === 128,
     `mask ${beforeSecond} -> ${cellAt(2, 3)}`);

  $('dotUndo').click();
  check('undo puts the cell back', cellAt(2, 3), beforeSecond);

  // Ctrl+Z is the same action.
  win.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
  await wait(60);
  check('ctrl+z undoes as well', cellAt(2, 3), maskBefore);

  // A drag paints in one direction rather than flickering as it crosses dots.
  const artView = $('output');
  const rowBefore = artLines()[4];
  artView.dispatchEvent(new win.PointerEvent('pointerdown', pointAt(4, 2, 0.25, 0.1)));
  for (let col = 2; col <= 8; col++) {
    artView.dispatchEvent(new win.PointerEvent('pointermove', pointAt(4, col, 0.25, 0.1)));
  }
  artView.dispatchEvent(new win.PointerEvent('pointerup', pointAt(4, 8, 0.25, 0.1)));
  await wait(80);
  // What a drag has to do is settle on one thing and do it all the way across,
  // rather than flipping each dot it passes. Counting how many cells *changed*
  // measured the picture underneath instead: with a different dithering method
  // most of them already held the value being painted, and the count collapsed
  // while the behaviour was perfectly correct.
  const painted = artLines()[4];
  const topLeft = (row, col) => (row.charCodeAt(col) - 0x2800) & 1;
  const states = new Set();
  for (let col = 2; col <= 8; col++) states.add(topLeft(painted, col));
  check('dragging paints every cell it crosses the same way', states.size, 1);
  ok('and it did paint rather than leave things alone',
     [...painted].some((ch, i) => ch !== rowBefore[i]),
     `${[...painted].filter((ch, i) => ch !== rowBefore[i]).length} cells changed`);

  mark('editing freezes regeneration');
  // --- editing freezes regeneration ---------------------------------------
  const frozen = $('output').textContent;
  $('threshold').value = '90';
  $('threshold').dispatchEvent(new Event('input', { bubbles: true }));
  await wait(350);
  check('moving a control does not wipe the edits', $('output').textContent, frozen);
  ok('and it says why', /не пересчитывается/.test($('status').textContent), $('status').textContent);

  mark('an explicit recalculation is allowed to discard them');
  // --- an explicit recalculation is allowed to discard them ----------------
  $('generate').click();
  await until(() => $('output').textContent !== frozen);
  ok('recalculating discards the edits and says so', /сброшены/.test($('dotHint').textContent),
     $('dotHint').textContent);
  check('editing switches itself off', $('dotEdit').getAttribute('aria-pressed'), 'false');
  check('undo history goes with it', $('dotUndo').disabled, true);
  ok('the art follows the controls again', $('output').textContent !== frozen);

  mark('lettering as a source');
  // --- lettering as a source ----------------------------------------------
  const BLANK_CELL = String.fromCharCode(0x2800);
  const inkedCount = () => [...$('output').textContent.split(String.fromCharCode(10)).join('')]
    .filter((ch) => ch !== BLANK_CELL).length;

  const imageMeta = $('srcMeta').textContent;
  const artBeforeText = $('output').textContent;
  check('the app starts on the image source', $('app').dataset.source, 'image');
  check('text controls are hidden while on an image', $('textInput').offsetParent, null);

  $('sourceKind').value = 'text';
  $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));

  check('switching swaps which controls are shown', $('app').dataset.source, 'text');
  ok('the file picker steps aside', $('file').offsetParent === null);
  ok('the text box appears', $('textInput').offsetParent !== null);
  ok('the font list is populated from the module', $('textFont').options.length >= 4,
     `${$('textFont').options.length} fonts`);

  // The image's art is still on screen for a frame or two, so wait for it to be
  // replaced before judging -- counting too early passes on stale content.
  ok('the default lettering is not empty', $('textInput').value.trim().length > 0,
     JSON.stringify($('textInput').value));
  ok('lettering produces art',
     await until(() => $('output').textContent !== artBeforeText && inkedCount() > 30),
     `${inkedCount()} inked cells`);
  const helloArt = $('output').textContent;
  ok('the source pane reports the drawn size', /^\d+×\d+$/.test($('srcMeta').textContent),
     $('srcMeta').textContent);

  $('textInput').value = 'IIIIII';
  $('textInput').dispatchEvent(new Event('input', { bubbles: true }));
  ok('editing the text redraws the art', await until(() => $('output').textContent !== helloArt));
  const narrowArt = $('output').textContent;

  $('textBold').checked = false;
  $('textBold').dispatchEvent(new Event('change', { bubbles: true }));
  ok('the weight changes the art', await until(() => $('output').textContent !== narrowArt));

  // Everything downstream must still apply, since lettering is just a canvas.
  $('modeAdvanced').click();
  $('edgeMode').value = 'xdog';
  $('edgeMode').dispatchEvent(new Event('change', { bubbles: true }));
  const outlined = await until(() => $('output').textContent !== narrowArt);
  ok('edge detection works on lettering too', outlined);
  $('edgeMode').value = 'none';
  $('edgeMode').dispatchEvent(new Event('change', { bubbles: true }));
  await wait(200);

  mark('switching back');
  // --- switching back ------------------------------------------------------
  $('sourceKind').value = 'image';
  $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
  ok('the previously loaded image comes back',
     await until(() => $('srcMeta').textContent === imageMeta),
     `${$('srcMeta').textContent}, expected ${imageMeta}`);
  ok('and it renders again', await until(() => inkedCount() > 0));

  mark('the choice is remembered');
  // --- the choice is remembered -------------------------------------------
  $('sourceKind').value = 'text';
  $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
  $('textInput').value = 'ЗАПОМНИ';
  $('textInput').dispatchEvent(new Event('input', { bubbles: true }));
  await wait(400);

  await reopen();
  await until(() => $('status').textContent.length > 0);

  check('the source kind survives a reload', $('app').dataset.source, 'text');
  check('the lettering survives a reload', $('textInput').value, 'ЗАПОМНИ');
  ok('and it draws itself without a file', await until(() => inkedCount() > 30),
     `${inkedCount()} inked cells`);

  {
    mark('making it fit');
    // --- making it fit ------------------------------------------------------
    // Lettering is used as the source: it is drawn with padding, so there are
    // guaranteed blank margins for trimming to find.
    $('sourceKind').value = 'text';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    $('textInput').value = 'AB';
    $('textInput').dispatchEvent(new Event('input', { bubbles: true }));
    $('outWidth').value = '80';
    $('outWidth').dispatchEvent(new Event('input', { bubbles: true }));

    const lines = () => $('output').textContent.split(String.fromCharCode(10));
    await until(() => lines()[0].length === 80);

    check('trimming is off unless asked for', $('trimBlank').checked, false);
    const untrimmedWidth = lines()[0].length;
    const untrimmedRows = lines().length;

    $('trimBlank').dispatchEvent(new Event('change', { bubbles: true }));
    $('trimBlank').checked = true;
    $('trimBlank').dispatchEvent(new Event('change', { bubbles: true }));

    ok('turning it on shrinks the art',
       await until(() => lines()[0].length < untrimmedWidth || lines().length < untrimmedRows),
       `${untrimmedWidth}×${untrimmedRows} -> ${lines()[0].length}×${lines().length}`);
    ok('and the meta says what happened', /после обрезки/.test($('meta').textContent), $('meta').textContent);

    $('trimBlank').checked = false;
    $('trimBlank').dispatchEvent(new Event('change', { bubbles: true }));
    ok('turning it off restores the full frame',
       await until(() => lines()[0].length === untrimmedWidth));

    mark('fitting to a message limit');
    // --- fitting to a message limit ----------------------------------------
    check('there is nothing to fit without a target', $('fitLimit').disabled, true);

    $('platform').value = 'discord';
    $('platform').dispatchEvent(new Event('change', { bubbles: true }));
    check('choosing a target enables it', $('fitLimit').disabled, false);

    $('outWidth').value = '300';
    $('outWidth').dispatchEvent(new Event('input', { bubbles: true }));
    await until(() => lines()[0].length === 300);
    const oversized = $('output').textContent.length;
    ok('300 wide is far past what Discord takes', oversized > 2000, `${oversized} characters`);

    $('fitLimit').click();
    ok('the search finishes', await until(() => /максимум|не влезает/.test($('status').textContent), 30000),
       $('status').textContent);

    const fittedWidth = Number($('outWidth').value);
    ok('it settled on a narrower width', fittedWidth < 300, `${fittedWidth} columns`);
    await until(() => lines()[0].length === fittedWidth);
    // eight characters for the code fence the copy button adds
    const fitted = $('output').textContent.length + 8;
    ok('and the result actually fits', fitted <= 2000, `${fitted} of 2000`);
    ok('while using most of the room', fitted > 1200, `${fitted} of 2000`);

    $('platform').value = 'none';
    $('platform').dispatchEvent(new Event('change', { bubbles: true }));
  }

  {
    mark('the sketch pad');
    // --- the sketch pad -----------------------------------------------------
    const BLANK = String.fromCharCode(0x2800);
    const NL = String.fromCharCode(10);
    const inkCount = () => [...$('output').textContent.split(NL).join('')].filter((c) => c !== BLANK).length;

    $('sourceKind').value = 'draw';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));

    check('the pad takes over the source pane', $('app').dataset.source, 'draw');
    ok('the pad is shown', $('drawCanvas').offsetParent !== null);
    ok('the file preview steps aside', $('srcCanvas').offsetParent === null);
    ok('brush controls appear', $('brushSize').offsetParent !== null);
    ok('cropping is not offered for a drawing', $('cropToggle').offsetParent === null);

    // The previous source's art is still on screen for a moment; waiting for
    // length alone would measure that instead of the empty pad.
    ok('an untouched pad encodes to nothing', await until(() => inkCount() === 0),
       `${inkCount()} inked cells`);

    // Draw a stroke across the pad and watch it turn into dots.
    const pad = $('drawCanvas');
    const padPoint = (fx, fy) => {
      const box = pad.getBoundingClientRect();
      const ratio = pad.width / pad.height;
      const shown = box.width / box.height > ratio
        ? { w: box.height * ratio, h: box.height }
        : { w: box.width, h: box.width / ratio };
      return {
        clientX: box.left + (box.width - shown.w) / 2 + shown.w * fx,
        clientY: box.top + (box.height - shown.h) / 2 + shown.h * fy,
        pointerId: 11,
        button: 0,
        bubbles: true,
        cancelable: true,
      };
    };
    const drawStroke = async (points) => {
      pad.dispatchEvent(new win.PointerEvent('pointerdown', padPoint(...points[0])));
      for (const point of points.slice(1)) {
        pad.dispatchEvent(new win.PointerEvent('pointermove', padPoint(...point)));
      }
      pad.dispatchEvent(new win.PointerEvent('pointerup', padPoint(...points.at(-1))));
      await wait(200);
    };

    await drawStroke([[0.15, 0.5], [0.4, 0.3], [0.6, 0.7], [0.85, 0.5]]);
    ok('a stroke becomes braille', await until(() => inkCount() > 20), `${inkCount()} inked cells`);
    const thinInk = inkCount();

    // A wider brush must lay down more.
    $('brushSize').value = '50';
    $('brushSize').dispatchEvent(new Event('input', { bubbles: true }));
    await drawStroke([[0.15, 0.2], [0.85, 0.2]]);
    ok('a wider brush lays down more', await until(() => inkCount() > thinInk),
       `${thinInk} then ${inkCount()}`);
    const withStrokes = inkCount();

    // Erasing takes it away again.
    $('brushErase').click();
    check('the eraser reports being on', $('brushErase').getAttribute('aria-pressed'), 'true');
    await drawStroke([[0.15, 0.2], [0.85, 0.2]]);
    ok('erasing removes dots', await until(() => inkCount() < withStrokes),
       `${withStrokes} then ${inkCount()}`);
    $('brushErase').click();

    $('drawClear').click();
    ok('clearing empties the pad', await until(() => inkCount() === 0));

    mark('the camera');
    // --- the camera ---------------------------------------------------------
    // Chrome is launched with a synthetic device, so this exercises the real
    // getUserMedia path without needing a webcam.
    $('sourceKind').value = 'camera';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));

    check('the camera takes the pane', $('app').dataset.source, 'camera');
    ok('the video is shown', $('camera').offsetParent !== null);
    ok('a capture button is offered', $('cameraCapture').offsetParent !== null);

    const streaming = await until(() => $('camera').videoWidth > 0, 20000);
    ok('the stream starts', streaming, $('status').textContent);

    if (streaming) {
      $('cameraCapture').click();
      ok('a frame is captured', await until(() => /Снят кадр/.test($('status').textContent)),
         $('status').textContent);
      ok('the frame becomes the source', /^\d+×\d+$/.test($('srcMeta').textContent), $('srcMeta').textContent);
      // Shape, not ink. The synthetic camera cycles through flat colours, and a
      // flat frame encodes to a legitimately blank grid -- demanding dots from
      // whatever moment the capture landed on made this fail about once in
      // three runs for no fault of the app.
      const grid = () => {
        const rows = $('output').textContent.split(NL).filter((line) => line.length);
        return { rows: rows.length, cols: rows[0]?.length ?? 0 };
      };
      ok('and it encodes to a full grid',
         await until(() => grid().rows > 1 && grid().cols === Number($('outWidth').value)),
         `${grid().cols}×${grid().rows} cells, ${inkCount()} of them inked`);
    }

    // Leaving the camera has to release it, or the light stays on.
    $('sourceKind').value = 'text';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    await wait(200);
    ok('leaving the camera releases the device',
       $('camera').srcObject === null || $('camera').srcObject.getTracks().every((t) => t.readyState === 'ended'));
  }

  {
    mark('colour on the page');
    // --- colour on the page -------------------------------------------------
    const colourFile = new win.DataTransfer();
    const paint = document.createElement('canvas');
    paint.width = 300; paint.height = 200;
    const px = paint.getContext('2d');
    const bands = ['#e04040', '#40e040', '#4060e0', '#e0e040'];
    bands.forEach((tone, i) => { px.fillStyle = tone; px.fillRect(i * 75, 0, 75, 200); });
    const blob = await new Promise((r) => paint.toBlob(r, 'image/png'));
    colourFile.items.add(new File([blob], 'bands.png', { type: 'image/png' }));

    $('sourceKind').value = 'image';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    $('file').files = colourFile.files;
    $('file').dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => $('srcMeta').textContent === '300×200');
    const plainArt = await stable(() => $('output').textContent);

    check('colour is off unless asked for', $('colour').checked, false);
    check('a plain art has no markup in it', $('output').querySelectorAll('span').length, 0);

    $('colour').checked = true;
    $('colour').dispatchEvent(new Event('change', { bubbles: true }));

    ok('turning it on tints the cells',
       await until(() => $('output').querySelectorAll('span').length > 0),
       `${$('output').querySelectorAll('span').length} runs`);
    check('but the dots are unchanged', $('output').textContent, plainArt);

    const tints = new Set([...$('output').querySelectorAll('span')].map((s) => s.style.color));
    ok('four bands give several distinct tints', tints.size >= 3, [...tints].join(' '));
    ok('runs are far fewer than cells',
       $('output').querySelectorAll('span').length < plainArt.replace(/\n/g, '').length / 4,
       `${$('output').querySelectorAll('span').length} runs for ${plainArt.replace(/\n/g, '').length} cells`);

    // And the second colour, which is where most of the colour error lives: the
    // unraised dots stop being the page and take a colour of their own.
    {
      check('the second colour waits for the first', $('cellGround').disabled, false);
      $('cellGround').checked = true;
      $('cellGround').dispatchEvent(new Event('change', { bubbles: true }));
      ok('turning it on paints behind the glyphs',
         await until(() => /background:#[0-9a-f]{6}/.test($('output').innerHTML), 6000),
         ($('output').querySelector('span')?.getAttribute('style') ?? 'no spans'));
      ok('and it travels in the link',
         await until(() => /(^|[#&])cg=1([&]|$)/.test(frame.contentWindow.location.hash), 3000),
         frame.contentWindow.location.hash);

      const drawn = $('lattice');
      if (!drawn.hidden) {
        const face = drawn.getContext('2d', { willReadFrequently: true });
        const strip = face.getImageData(0, 0, drawn.width, Math.min(30, drawn.height)).data;
        let painted = 0;
        for (let i = 3; i < strip.length; i += 4) if (strip[i] > 200) painted++;
        ok('and the drawn copy fills its cells rather than leaving the page',
           painted > strip.length / 8, `${painted} opaque of ${strip.length / 4}`);
      }

      // The panel says what a mode means for copying, because the mosaic is
      // easy to copy into a chat and be disappointed by.
      const rows = () => [...frame.contentDocument.querySelectorAll('.decided dt')]
        .map((dt, i) => `${dt.textContent}: ${frame.contentDocument.querySelectorAll('.decided dd')[i]?.textContent ?? ''}`);
      const travels = () => rows().find((row) => row.startsWith('Копирование текстом')) ?? '';
      ok('with colour on, the panel says the colour will not travel',
         /цвет — нет/.test(travels()), travels());

      // And the mode where colour picks the dots as well, which needs both.
      check('choosing dots by colour waits for both', $('colourPattern').disabled, false);
      const byTone = await stable(() => $('output').textContent);
      $('colourPattern').checked = true;
      $('colourPattern').dispatchEvent(new Event('change', { bubbles: true }));
      const byColour = await stable(() => $('output').textContent);
      ok('turning it on redraws the art from the colours', byColour !== byTone,
         `${byTone.slice(0, 12)} against ${byColour.slice(0, 12)}`);
      ok('and it travels in the link as well',
         await until(() => /(^|[#&])cp=1([&]|$)/.test(frame.contentWindow.location.hash), 3000),
         frame.contentWindow.location.hash);
      ok('and the panel now says the mosaic needs a picture',
         await until(() => /копируйте её картинкой/.test(travels()), 3000), travels());

      // Copying says the same thing at the moment it matters.
      $('copy').click();
      ok('and so does the status when it is copied',
         await until(() => /картинкой было бы видно|не дал странице|не умеет/.test($('status').textContent), 6000),
         $('status').textContent);
      $('colourPattern').checked = false;
      $('colourPattern').dispatchEvent(new Event('change', { bubbles: true }));
      await stable(() => $('output').textContent);

      $('cellGround').checked = false;
      $('cellGround').dispatchEvent(new Event('change', { bubbles: true }));
      ok('turning it off goes back to ink alone',
         await until(() => !/background:#/.test($('output').innerHTML), 6000));
      check('and choosing dots by colour goes dead with it', $('colourPattern').disabled, true);
    }

    // The tint has to reach the drawn copy as well, or the page would show a
    // white art while claiming a coloured one.
    {
      const shown = $('lattice');
      const paints = shown.getContext('2d', { willReadFrequently: true })
        .getImageData(0, 0, shown.width, shown.height).data;
      const seen = new Set();
