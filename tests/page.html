      for (let i = 0; i < paints.length; i += 4) {
        if (paints[i + 3] > 200) seen.add(`${paints[i] >> 5},${paints[i + 1] >> 5},${paints[i + 2] >> 5}`);
      }
      ok('and the drawn dots are tinted too', seen.size >= 3, `${seen.size} colours on the canvas`);
    }

    $('colour').checked = false;
    $('colour').dispatchEvent(new Event('change', { bubbles: true }));
    ok('turning it off returns to plain text',
       await until(() => $('output').querySelectorAll('span').length === 0));
  }

  {
    mark('switching language');
    // --- switching language -------------------------------------------------
    const label = (forId) => frame.contentDocument.querySelector(`label[for="${forId}"]`).textContent;

    check('the picker offers both languages', $('language').options.length, 2);
    check('the run is pinned to russian', $('language').value, 'ru');
    check('markup follows the language', label('threshold'), 'Порог');
    check('so does the document', frame.contentDocument.documentElement.lang, 'ru-RU');

    $('language').value = 'en';
    $('language').dispatchEvent(new Event('change', { bubbles: true }));

    check('switching retranslates the markup', label('threshold'), 'Threshold');
    check('and the document tag', frame.contentDocument.documentElement.lang, 'en');
    ok('options built at run time follow too',
       [...$('preset').options].some((o) => o.textContent === 'Photographs'),
       [...$('preset').options].map((o) => o.textContent).join(' | '));
    ok('and so do the ones named from data',
       [...$('platform').options].some((o) => o.textContent === 'Nowhere in particular'));

    // The choice has to outlast a reload, like every other setting.
    await wait(400);
    await reopen();
    await until(() => $('status').textContent.length > 0);
    check('the language is remembered', $('language').value, 'en');
    check('and applied on load', label('threshold'), 'Threshold');
  }

  {
    mark('reachable without a pointer');
    // --- reachable without a pointer ---------------------------------------
    const BLANK = String.fromCharCode(0x2800);
    const NL = String.fromCharCode(10);
    const inkCount = () => [...$('output').textContent.split(NL).join('')].filter((c) => c !== BLANK).length;
    const press = (target, key, options = {}) => {
      target.dispatchEvent(new win.KeyboardEvent('keydown', {
        key, bubbles: true, cancelable: true, ...options,
      }));
    };

    const skip = frame.contentDocument.querySelector('.skip');
    ok('there is a way past the panel', skip !== null && skip.getAttribute('href') === '#output',
       skip?.getAttribute('href'));
    ok('and it says where it goes', (skip?.textContent ?? '').length > 0, skip?.textContent);

    // Start from a known image.
    const known = new win.DataTransfer();
    known.items.add(await makeFile(320, 160, 'keys.png'));
    $('sourceKind').value = 'image';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    win.dispatchEvent(new win.DragEvent('drop', { dataTransfer: known, bubbles: true, cancelable: true }));
    await until(() => $('srcMeta').textContent === '320×160');
    await until(() => inkCount() > 0);

    mark('cropping');
    // --- cropping -----------------------------------------------------------
    $('cropToggle').click();
    check('the crop layer can be focused', frame.contentDocument.activeElement, $('cropper'));
    ok('and it explains its keys', /Shift/.test($('cropper').getAttribute('aria-label')),
       $('cropper').getAttribute('aria-label'));

    const rowsWhole = $('output').textContent.split(NL).length;
    for (let i = 0; i < 8; i++) press($('cropper'), 'ArrowLeft', { shiftKey: true });
    ok('shift with arrows resizes the selection',
       await until(() => $('output').textContent.split(NL).length !== rowsWhole),
       `${rowsWhole} rows then ${$('output').textContent.split(NL).length}`);

    press($('cropper'), 'Escape');
    ok('escape gives the whole frame back',
       await until(() => $('output').textContent.split(NL).length === rowsWhole));
    $('cropToggle').click();
    check('the layer stops taking focus when off', $('cropper').hasAttribute('tabindex'), false);

    mark('editing dots');
    // --- editing dots -------------------------------------------------------
    $('dotEdit').click();
    check('the art takes focus for editing', frame.contentDocument.activeElement, $('output'));
    check('a cursor appears', $('dotCursor').hidden, false);

    const cursorAt = () => `${$('dotCursor').style.left},${$('dotCursor').style.top}`;
    const start = cursorAt();
    press($('output'), 'ArrowRight');
    ok('arrows move it', cursorAt() !== start, `${start} -> ${cursorAt()}`);
    const afterRight = cursorAt();
    press($('output'), 'ArrowDown');
    ok('in both directions', cursorAt() !== afterRight, `${afterRight} -> ${cursorAt()}`);

    const beforeToggle = $('output').textContent;
    press($('output'), ' ');
    await wait(80);
    ok('space sets and clears a dot', $('output').textContent !== beforeToggle);
    check('exactly one cell changes',
      [...$('output').textContent].filter((c, i) => c !== beforeToggle[i]).length, 1);

    press($('output'), 'z', { ctrlKey: true });
    await wait(80);
    check('and ctrl+z takes it back', $('output').textContent, beforeToggle);

    // Shift should step a whole cell, which is two dots across.
    const beforeShift = cursorAt();
    press($('output'), 'ArrowRight');
    const oneDot = Number.parseFloat($('dotCursor').style.left) - Number.parseFloat(beforeShift);
    press($('output'), 'ArrowLeft');
    press($('output'), 'ArrowRight', { shiftKey: true });
    const oneCell = Number.parseFloat($('dotCursor').style.left) - Number.parseFloat(beforeShift);
    ok('shift steps a whole cell', Math.abs(oneCell - oneDot * 2) < 0.6,
       `${oneDot.toFixed(2)}px per dot, ${oneCell.toFixed(2)}px with shift`);

    $('dotEdit').click();
    check('the cursor goes away with the mode', $('dotCursor').hidden, true);

    mark('drawing');
    // --- drawing ------------------------------------------------------------
    $('sourceKind').value = 'draw';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => inkCount() === 0);
    ok('the pad can be focused', $('drawCanvas').tabIndex === 0);
    ok('and explains its keys', /Enter/.test($('drawCanvas').getAttribute('aria-label')),
       $('drawCanvas').getAttribute('aria-label'));

    $('drawCanvas').focus();
    press($('drawCanvas'), 'Enter');
    check('enter puts the pen down', $('padCursor').dataset.pen, 'down');
    for (let i = 0; i < 12; i++) press($('drawCanvas'), 'ArrowRight', { shiftKey: true });
    ok('and arrows draw with it', await until(() => inkCount() > 0), `${inkCount()} inked cells`);

    press($('drawCanvas'), 'Enter');
    check('enter lifts it again', $('padCursor').dataset.pen, 'up');
    const drawn = inkCount();
    for (let i = 0; i < 6; i++) press($('drawCanvas'), 'ArrowDown', { shiftKey: true });
    await wait(200);
    check('a lifted pen leaves no trail', inkCount(), drawn);

    mark('the enlarged view is a dialog');
    // --- the enlarged view is a dialog --------------------------------------
    $('sourceKind').value = 'image';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => inkCount() > 0);

    const figure = $('srcCanvas').closest('[data-inspect]');
    figure.focus();
    figure.click();
    const dialogs = frame.contentDocument.querySelectorAll('.inspect');
    check('one click opens exactly one view', dialogs.length, 1);
    const dialog = dialogs[0];
    check('it announces itself as a dialog', dialog?.getAttribute('role'), 'dialog');
    check('and as a modal one', dialog?.getAttribute('aria-modal'), 'true');
    ok('it carries a name', (dialog?.getAttribute('aria-label') ?? '').length > 0);
    const inDialog = frame.contentDocument.activeElement;
    ok('focus moves into it', dialog === inDialog || dialog?.contains(inDialog),
       `${inDialog?.tagName}.${inDialog?.className}`);

    press(frame.contentDocument, 'Escape');
    await wait(80);
    check('escape closes it', frame.contentDocument.querySelector('.inspect'), null);
    check('and focus comes back', frame.contentDocument.activeElement, figure);
  }

  {
    mark('the address bar follows the settings');
    // --- the address bar follows the settings -------------------------------
    $('modeAdvanced').click();
    $('dither').value = 'bayer4';
    $('dither').dispatchEvent(new Event('change', { bubbles: true }));
    $('outWidth').value = '73';
    $('outWidth').dispatchEvent(new Event('input', { bubbles: true }));
    await wait(400);

    const hash = () => frame.contentWindow.location.hash;
    ok('the fragment carries the width', /(^|[#&])w=73([&]|$)/.test(hash()), hash());
    ok('and the method', /(^|[#&])d=bayer4([&]|$)/.test(hash()), hash());
    check('the settings are not in the query string', /w=73/.test(frame.contentWindow.location.search), false);

    // A fragment is never sent to the server, which is the point of using one.
    ok('the path itself stays clean', frame.contentWindow.location.pathname.endsWith('index.html'),
       frame.contentWindow.location.pathname);
    check('the fragment holds every setting', /m=|l=|t=/.test(hash()), true);

    mark('and a link sets them up again');
    // --- and a link sets them up again --------------------------------------
    await reopen('#w=37&d=atkinson&t=201&m=advanced&col=1&lang=ru');
    await until(() => $('status').textContent.length > 0);

    check('the width comes from the link', $('outWidth').value, '37');
    check('so does the method', $('dither').value, 'atkinson');
    check('and the threshold', $('threshold').value, '201');
    check('and the mode', $('app').dataset.mode, 'advanced');
    check('and a checkbox', $('colour').checked, true);
    check('and the language', $('language').value, 'ru');
    ok('and it says where they came from', /из ссылки/.test($('status').textContent), $('status').textContent);

    // The link outranks whatever this browser had stored: following one is a
    // deliberate act.
    ok('a stored setting is overridden by the link', $('dither').value !== 'bayer4');

    // Settings are written on a coalesced frame, so reopening the instant the
    // status appears can beat the write and read back the previous run's width.
    // The stored blob is the thing being tested, so wait for it, not for a
    // guess at how long it takes.
    const stored = () => {
      try { return JSON.parse(localStorage.getItem('braille-art.settings') ?? '{}'); } catch { return {}; }
    };
    ok('the link is what got stored', await until(() => stored().outWidth === '37', 3000),
       String(stored().outWidth));

    await reopen();
    await until(() => $('status').textContent.length > 0);
    check('without a link, storage is used again', $('outWidth').value, '37');
    $('language').value = 'ru';
    $('language').dispatchEvent(new Event('change', { bubbles: true }));
  }

  {
    mark('edges can look at colour');
    // --- edges can look at colour -------------------------------------------
    // A boundary between two colours of the same brightness leaves no trace in
    // the light, so the detector has to be told to look at the colour axes too.
    // It costs ink on a photograph, which is why it arrives with the preset
    // that asks for it rather than switched on for everyone. This goes last
    // because it needs a picture with colour in it, and leaves one loaded.
    const split = document.createElement('canvas');
    split.width = 240;
    split.height = 160;
    const face = split.getContext('2d');
    face.fillStyle = '#c03030'; face.fillRect(0, 0, 120, 160);
    face.fillStyle = '#00792a'; face.fillRect(120, 0, 120, 160);
    const halves = new win.DataTransfer();
    halves.items.add(new File([await new Promise((r) => split.toBlob(r, 'image/png'))],
      'halves.png', { type: 'image/png' }));

    $('sourceKind').value = 'image';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    $('file').files = halves.files;
    $('file').dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => $('srcMeta').textContent === '240×160');

    $('preset').value = 'photo';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => $('edgeMode').value === 'none');
    check('a photograph is left with brightness alone', $('edgeColour').checked, false);
    check('and the box is dead while no detector is chosen', $('edgeColour').disabled, true);

    $('preset').value = 'lineart';
    $('preset').dispatchEvent(new Event('change', { bubbles: true }));
    ok('a drawing asks for colour', await until(() => $('edgeColour').checked, 3000));
    check('and the box comes alive with it', $('edgeColour').disabled, false);

    const withColour = await stable(() => $('output').textContent);
    $('edgeColour').checked = false;
    $('edgeColour').dispatchEvent(new Event('change', { bubbles: true }));
    const brightnessOnly = await stable(() => $('output').textContent);

    const dots = (text) => [...text.split(NEWLINE).join('')].filter((glyph) => glyph !== BLANK).length;
    ok('the join is drawn when colour is looked at, and not when it is not',
       dots(withColour) > dots(brightnessOnly),
       `${dots(brightnessOnly)} cells against ${dots(withColour)}`);
    ok('and the colour choice travels in the link too',
       await until(() => /(^|[#&])eco=0([&]|$)/.test(frame.contentWindow.location.hash), 3000),
       frame.contentWindow.location.hash);
  }

  {
    mark('the blocks, if this machine has them');
    // --- the blocks, if this machine has them --------------------------------
    // Unicode 16's octants are the same cell without the gaps, and new enough
    // that the font may not have them. Offering them blind would put empty
    // boxes in someone's picture, so the page checks first -- and what is
    // checked here is that it answers one way or the other, in the page's own
    // language, rather than that this particular machine has the font.
    const blocks = $('glyphSet').querySelector('option[value="octants"]');
    if (blocks.disabled) {
      ok('a machine without the font is told so', /шрифта для блоков нет/.test($('glyphHint').textContent),
         $('glyphHint').textContent);
      check('and it stays on braille', $('glyphSet').value, 'braille');
      check('so hand editing is still there', $('dotEdit').disabled, false);
    } else {
      const asBraille = await stable(() => $('output').textContent);
      $('glyphSet').value = 'octants';
      $('glyphSet').dispatchEvent(new Event('change', { bubbles: true }));
      const asBlocks = await stable(() => $('output').textContent);
      ok('switching writes the art in blocks', asBlocks !== asBraille && !/[⠀-⣿]/.test(asBlocks),
         asBlocks.slice(0, 16));
      check('and hand editing steps aside', $('dotEdit').disabled, true);
      ok('and the choice travels in the link',
         await until(() => /(^|[#&])gs=octants([&]|$)/.test(frame.contentWindow.location.hash), 3000),
         frame.contentWindow.location.hash);
      $('glyphSet').value = 'braille';
      $('glyphSet').dispatchEvent(new Event('change', { bubbles: true }));
      await stable(() => $('output').textContent);
    }
  }

  {
    mark('work can be kept and opened again');
    // --- work can be kept and opened again -----------------------------------
    // The gallery lives in the browser's own database, which is the only place
    // a static page can put a photograph. What is checked is the whole round
    // trip -- save, list, change everything, open it back, delete -- because
    // each half of it is useless without the other.
    const drawn = document.createElement('canvas');
    drawn.width = 160;
    drawn.height = 100;
    const paint = drawn.getContext('2d');
    const ramp = paint.createLinearGradient(0, 0, 160, 100);
    ramp.addColorStop(0, '#204090');
    ramp.addColorStop(1, '#f0d060');
    paint.fillStyle = ramp;
    paint.fillRect(0, 0, 160, 100);
    const carrier = new win.DataTransfer();
    carrier.items.add(new File([await new Promise((r) => drawn.toBlob(r, 'image/png'))],
      'ramp.png', { type: 'image/png' }));

    $('sourceKind').value = 'image';
    $('sourceKind').dispatchEvent(new Event('change', { bubbles: true }));
    $('file').files = carrier.files;
    $('file').dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => $('srcMeta').textContent === '160×100');

    $('outWidth').value = '44';
    $('outWidth').dispatchEvent(new Event('input', { bubbles: true }));
    const kept = await stable(() => $('output').textContent);

    $('workName').value = 'проба';
    $('workSave').click();
    ok('saving says so', await until(() => /Сохранено как/.test($('status').textContent), 8000),
       $('status').textContent);
    ok('and the work appears in the list',
       await until(() => $('worksList').querySelector('.who')?.textContent === 'проба', 5000),
       $('worksList').textContent.slice(0, 60));

    // Change the art out of recognition, then ask for the saved one back.
    $('outWidth').value = '70';
    $('outWidth').dispatchEvent(new Event('input', { bubbles: true }));
    const wandered = await stable(() => $('output').textContent);
    ok('the art has moved on', wandered !== kept);

    $('worksList').querySelectorAll('button')[0].click();
    ok('opening it brings the art back exactly',
       await until(() => $('output').textContent === kept, 10000),
       `width ${$('outWidth').value}`);
    check('and the width with it', $('outWidth').value, '44');

    // The same work, dropped on the page as a file. Dropping a picture is how
    // most things start here; a saved work is the other thing worth dropping,
    // and it should not need a different gesture.
    {
      // Built by the app's own packer, so the test cannot drift from the format.
      const module = await import('../src/ui/store.js');
      const packed = await module.packWork({
        name: 'из файла',
        saved: Date.now(),
        cols: 30,
        rows: 8,
        settings: { outWidth: '30', dither: 'bayer4' },
        art: '⣿⠿' + NEWLINE + '⠿⣿',
        source: null,
      });
      const carry = new win.DataTransfer();
      carry.items.add(new File([packed], 'work.braille.json', { type: 'application/json' }));
      frame.contentWindow.dispatchEvent(new win.DragEvent('drop', {
        dataTransfer: carry, bubbles: true, cancelable: true,
      }));
      ok('a dropped work file opens', await until(() => /из файла/.test($('status').textContent), 6000),
         $('status').textContent);
      ok('and its settings arrive with it', await until(() => $('dither').value === 'bayer4', 4000),
         `${$('dither').value}, width ${$('outWidth').value}`);
    }

    $('worksList').querySelectorAll('button')[1].click();
    ok('deleting empties the list',
       await until(() => /Пока пусто/.test($('worksList').textContent), 5000),
       $('worksList').textContent.slice(0, 40));
  }

  const failed = log.filter((l) => l.startsWith('FAIL')).length;
  out(`${log.join('\n')}\n${failed ? `\n${failed} FAILED` : '\nAll e2e checks passed.'}`);
}

run().catch((err) => out(`THREW: ${err?.stack ?? err}\n\n--- progress ---\n${log.join('\n')}`));
</script>
</body>
</html>
