<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>0.2 smoke</title></head>
<body>
<pre id="r">running</pre>
<script type="module">
import { binarize, encode, imageDataToBraille, toLuminance, tonePlane, trimBlank } from '../src/core/braille.js';
import { DITHER_METHODS, DEFAULT_DITHER } from '../src/core/dither.js';
import { BLUE_NOISE_SIZE, blueNoiseMatrix } from '../src/core/bluenoise.js';
import { otsuThreshold } from '../src/core/otsu.js';
import { lightness, linearToThreshold, luminance, thresholdToLinear } from '../src/core/gamma.js';
import { applyAdjustments } from '../src/core/adjust.js';
import { gaussianBlur } from '../src/core/blur.js';
import { sobel, xdog, applyEdges } from '../src/core/edges.js';
import { CONTENT_PRESETS } from '../src/core/presets.js';
import { EDGE_MODES } from '../src/core/edges.js';
import { createCanvas, drawScaled, readImageData } from '../src/ui/canvas.js';
import { FULL_FRAME, isWholeImage } from '../src/ui/crop.js';
import { DEFAULT_TEXT_FONT, TEXT_FONTS, renderText } from '../src/ui/text.js';
import { FALLBACK, LOCALES, formatNumber, setLocale, t } from '../src/i18n/index.js';
import { fromHash, textFits, toHash } from '../src/ui/link.js';
import { brailleToAnsi, brailleToHtml, brailleToSvg } from '../src/ui/export.js';
import { cellColours, cellHex, colourRuns } from '../src/core/colour.js';
import {
  PLATFORMS, calibrationOf, clearCalibration, forPlatform, messageLength, partsFit, ruler,
  saveCalibration, splitForPlatform,
} from '../src/ui/platforms.js';
import { createPipeline } from '../src/ui/pipeline.js';

const out = (t) => {
  document.getElementById('r').textContent = t;
  fetch('/result', { method: 'POST', body: t });
};
const log = [];
const ok = (name, cond, detail = '') => log.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? ': ' + detail : ''}`);
const check = (name, got, want) => log.push(`${got === want ? 'PASS' : 'FAIL'}  ${name}: ${got}${got === want ? '' : ` (want ${want})`}`);
const near = (name, got, lo, hi) => log.push(`${got >= lo && got <= hi ? 'PASS' : 'FAIL'}  ${name}: ${got.toFixed(3)} (want ${lo}..${hi})`);
const coverage = (bits) => bits.reduce((a, b) => a + b, 0) / bits.length;

window.addEventListener('error', (e) => out(`WINDOW ERROR: ${e.message}\n${e.error?.stack ?? ''}\n\n--- progress ---\n${log.join('\n')}`));
window.addEventListener('unhandledrejection', (e) => out(`UNHANDLED REJECTION: ${e.reason?.stack ?? e.reason}\n\n--- progress ---\n${log.join('\n')}`));

async function run() {
  const W = 64, H = 64;
  const flat = (v) => { const p = new Float32Array(W * H); p.fill(v); return p; };

  // --- the point of dithering: render a tone a threshold cannot ------------
  const gray64 = flat(64);
  check('hard threshold cannot render 25% gray', coverage(DITHER_METHODS.threshold(gray64, W, H, 128)), 0);
  near('floyd-steinberg renders 25% gray', coverage(DITHER_METHODS['floyd-steinberg'](gray64, W, H, 128)), 0.20, 0.30);
  near('bayer4 renders 25% gray', coverage(DITHER_METHODS.bayer4(gray64, W, H, 128)), 0.20, 0.30);
  near('atkinson renders a mid tone', coverage(DITHER_METHODS.atkinson(gray64, W, H, 128)), 0.10, 0.35);

  const gray192 = flat(192);
  check('hard threshold saturates 75% gray', coverage(DITHER_METHODS.threshold(gray192, W, H, 128)), 1);
  near('floyd-steinberg renders 75% gray', coverage(DITHER_METHODS['floyd-steinberg'](gray192, W, H, 128)), 0.70, 0.80);

  // --- a linear ramp must come out roughly half lit ------------------------
  const ramp = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) ramp[y * W + x] = (x / (W - 1)) * 255;
  // Sauvola is excluded on purpose: it picks a threshold per neighbourhood
  // rather than reproducing a tone, so preserving the average is not something
  // it promises. It gets its own checks below.
  for (const name of Object.keys(DITHER_METHODS)) {
    if (name === 'sauvola') continue;
    near(`${name}: gradient coverage`, coverage(DITHER_METHODS[name](ramp, W, H, 128)), 0.42, 0.58);
  }

  // --- a local threshold, where one number cannot work --------------------
  // Detail of constant *relative* contrast laid over a background that runs
  // from dim to bright: stripes at 45% of whatever the background is here.
  // This is the shape of a photograph lit from one side.
  const uneven = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const background = 60 + (x / (W - 1)) * 195;
      uneven[y * W + x] = y % 12 < 6 ? background * 0.45 : background;
    }
  }

  const quarterCoverage = (bits, quarter) => {
    let lit = 0;
    let total = 0;
    const from = Math.floor((W * quarter) / 4);
    const to = Math.floor((W * (quarter + 1)) / 4);
    for (let y = 0; y < H; y++) {
      for (let x = from; x < to; x++) {
        total++;
        lit += bits[y * W + x];
      }
    }
    return lit / total;
  };

  const globalBits = DITHER_METHODS.threshold(uneven, W, H, 128, 128);
  const localBits = DITHER_METHODS.sauvola(uneven, W, H, 128, 128);

  log.push(`INFO  quarters, global: ${[0, 1, 2, 3].map((q) => quarterCoverage(globalBits, q).toFixed(2)).join(' ')}`);
  log.push(`INFO  quarters, sauvola: ${[0, 1, 2, 3].map((q) => quarterCoverage(localBits, q).toFixed(2)).join(' ')}`);

  ok('a single threshold loses the dim end entirely', quarterCoverage(globalBits, 0) < 0.02,
     `${(quarterCoverage(globalBits, 0) * 100).toFixed(0)}% survives`);
  ok('sauvola keeps the detail there', quarterCoverage(localBits, 0) > 0.4,
     `${(quarterCoverage(localBits, 0) * 100).toFixed(0)}% survives`);
  ok('and keeps it at the bright end too', quarterCoverage(localBits, 3) > 0.4,
     `${(quarterCoverage(localBits, 3) * 100).toFixed(0)}%`);
  ok('so the detail reads evenly across the frame',
     Math.abs(quarterCoverage(localBits, 0) - quarterCoverage(localBits, 3)) < 0.15,
     `${quarterCoverage(localBits, 0).toFixed(2)} against ${quarterCoverage(localBits, 3).toFixed(2)}`);

  // Flat means flat: the variance term is what stops an even area dissolving.
  const flatLocal = DITHER_METHODS.sauvola(flat(120), W, H, 128, 128);
  const flatSpread = coverage(flatLocal);
  ok('an even area is not turned into noise', flatSpread === 0 || flatSpread === 1,
     `coverage ${flatSpread}`);

  // The control still does something: it shifts what the method chose.
  const darker = coverage(DITHER_METHODS.sauvola(uneven, W, H, 200, 128));
  const lighter = coverage(DITHER_METHODS.sauvola(uneven, W, H, 60, 128));
  ok('raising the control removes dots', darker < coverage(localBits), `${darker.toFixed(2)}`);
  ok('lowering it adds them', lighter > coverage(localBits), `${lighter.toFixed(2)}`);

  // --- bayer is position-only; error diffusion is not ----------------------
  const full = DITHER_METHODS.bayer4(ramp, W, H, 128);
  const firstRows = DITHER_METHODS.bayer4(ramp.slice(0, W * 4), W, 4, 128);
  let same = true;
  for (let i = 0; i < W * 4; i++) if (full[i] !== firstRows[i]) same = false;
  check('bayer4 depends only on position', same, true);

  // --- blue noise ----------------------------------------------------------
  const matrix = blueNoiseMatrix();
  check('the tile is the declared size', matrix.length, BLUE_NOISE_SIZE * BLUE_NOISE_SIZE);
  const ranks = [...matrix].map((v) => Math.round(v * matrix.length - 0.5));
  check('every rank appears exactly once', new Set(ranks).size, matrix.length);
  ok('no threshold reaches the ends', Math.min(...matrix) > 0 && Math.max(...matrix) < 1,
     `${Math.min(...matrix).toFixed(4)}..${Math.max(...matrix).toFixed(4)}`);
  ok('the tile is built the same way every time', blueNoiseMatrix() === matrix);

  // The property that makes it blue: the points chosen first are spread out
  // rather than clumped, so no scale carries a repeating structure.
  const N = BLUE_NOISE_SIZE;
  const toroidal = (a, b) => {
    const dx = Math.min(Math.abs(a[0] - b[0]), N - Math.abs(a[0] - b[0]));
    const dy = Math.min(Math.abs(a[1] - b[1]), N - Math.abs(a[1] - b[1]));
    return Math.hypot(dx, dy);
  };
  const meanNearest = (points) => points.reduce((total, p) => {
    let closest = Infinity;
    for (const q of points) if (q !== p) closest = Math.min(closest, toroidal(p, q));
    return total + closest;
  }, 0) / points.length;

  const firstTenth = Math.round(matrix.length * 0.1);
  const chosen = ranks
    .map((rank, i) => [rank, i])
    .filter(([rank]) => rank < firstTenth)
    .map(([, i]) => [i % N, (i / N) | 0]);

  let seed = 12345;
  const nextRandom = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const scattered = [];
  const taken = new Set();
  while (scattered.length < firstTenth) {
    const i = Math.floor(nextRandom() * matrix.length);
    if (taken.has(i)) continue;
    taken.add(i);
    scattered.push([i % N, (i / N) | 0]);
  }

  const spreadBlue = meanNearest(chosen);
  const spreadRandom = meanNearest(scattered);
  ok('early points are spread further apart than chance', spreadBlue > spreadRandom * 1.2,
     `${spreadBlue.toFixed(2)} against ${spreadRandom.toFixed(2)} random`);

  // It has to remain an ordered method: no error travels, so a region's result
  // cannot depend on what is above it.
  const wholeRamp = DITHER_METHODS.bluenoise(ramp, W, H, 128);
  const topRows = DITHER_METHODS.bluenoise(ramp.slice(0, W * 4), W, 4, 128);
  let tilesAgree = true;
  for (let i = 0; i < W * 4; i++) if (wholeRamp[i] !== topRows[i]) tilesAgree = false;
  check('blue noise depends only on position', tilesAgree, true);
  near('blue noise: gradient coverage', coverage(wholeRamp), 0.42, 0.58);

  // And it should not look like Bayer: the two tiles must disagree widely.
  const bayerBits = DITHER_METHODS.bayer4(ramp, W, H, 128);
  let differing = 0;
  for (let i = 0; i < wholeRamp.length; i++) if (wholeRamp[i] !== bayerBits[i]) differing++;
  ok('its texture is nothing like the ordered matrix', differing > wholeRamp.length * 0.1,
     `${((differing / wholeRamp.length) * 100).toFixed(0)}% of pixels differ`);

  // --- inversion is an exact complement ------------------------------------
  const normal = binarize(ramp, W, H, { threshold: 128, invert: false, method: 'atkinson' });
  const flipped = binarize(ramp, W, H, { threshold: 128, invert: true, method: 'atkinson' });
  let complement = true;
  for (let i = 0; i < normal.length; i++) if (normal[i] === flipped[i]) complement = false;
  check('invert is an exact complement', complement, true);

  check('unknown method rejected', (() => {
    try { binarize(ramp, W, H, { method: 'nope' }); return false; } catch (e) { return e instanceof RangeError; }
  })(), true);
  check('default method', DEFAULT_DITHER, 'floyd-steinberg');

  // --- Otsu ----------------------------------------------------------------
  const bimodal = new Float32Array(W * H);
  for (let i = 0; i < bimodal.length; i++) bimodal[i] = i % 2 ? 200 : 50;
  near('otsu splits 50/200 between the modes', otsuThreshold(bimodal), 50, 199);
  check('otsu on a flat plane stays in range', otsuThreshold(flat(77)) >= 0, true);

  // --- blur ----------------------------------------------------------------
  // Clamped edges, not zero padding: a flat plane must stay exactly flat, or
  // every border darkens and both detectors light up around the frame.
  const maxDeviation = (plane, expected) => plane.reduce((m, v) => Math.max(m, Math.abs(v - expected)), 0);
  near('gaussian blur leaves a flat plane flat', maxDeviation(gaussianBlur(flat(100), W, H, 2), 100), 0, 0.01);

  // --- edge detectors ------------------------------------------------------
  const peak = (plane) => plane.reduce((m, v) => Math.max(m, v), 0);
  const midRow = (plane, x) => plane[Math.floor(H / 2) * W + x];

  check('sobel is silent on a flat plane', peak(sobel(flat(100), W, H)), 0);
  check('xdog is silent on a flat plane', peak(xdog(flat(100), W, H, 1)), 0);

  // A vertical step: black on the left, white on the right.
  const step = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) step[y * W + x] = x < W / 2 ? 0 : 255;

  const sob = sobel(step, W, H);
  ok('sobel responds at the boundary', midRow(sob, W / 2 - 1) > 100, `${midRow(sob, W / 2 - 1).toFixed(0)} at the edge`);
  check('sobel is silent far from the boundary', midRow(sob, 5), 0);

  const ink = xdog(step, W, H, 1);
  ok('xdog draws a stroke at the boundary', midRow(ink, W / 2 - 1) > 100, `${midRow(ink, W / 2 - 1).toFixed(0)} at the edge`);
  check('xdog is silent far from the boundary', midRow(ink, 5), 0);
  // One-sided by construction: ink lands on the dark side of an edge rather
  // than straddling it, which is what makes it read as a drawn stroke.
  ok('xdog stroke is one-sided', midRow(ink, W / 2 - 1) > midRow(ink, W / 2 + 1),
     `dark side ${midRow(ink, W / 2 - 1).toFixed(0)} vs light side ${midRow(ink, W / 2 + 1).toFixed(0)}`);

  // --- mixing --------------------------------------------------------------
  check('mode none passes the plane straight through', applyEdges(step, W, H, { mode: 'none' }) === step, true);
  check('amount 0 passes the plane straight through', applyEdges(step, W, H, { mode: 'xdog', amount: 0 }) === step, true);

  const pureLines = applyEdges(step, W, H, { mode: 'xdog', amount: 1, radius: 1 });
  const halfMix = applyEdges(step, W, H, { mode: 'xdog', amount: 0.5, radius: 1 });
  const at = Math.floor(H / 2) * W + Math.floor(W / 2) + 4;
  near('half mix sits between tone and line', halfMix[at],
    Math.min(step[at], pureLines[at]), Math.max(step[at], pureLines[at]));
  check('unknown edge mode rejected', (() => {
    try { applyEdges(step, W, H, { mode: 'canny' }); return false; } catch (e) { return e instanceof RangeError; }
  })(), true);

  // --- edges change what gets encoded --------------------------------------
  const edgeImage = new ImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4, v = x < W / 2 ? 30 : 220;
    edgeImage.data[i] = edgeImage.data[i + 1] = edgeImage.data[i + 2] = v;
    edgeImage.data[i + 3] = 255;
  }
  const NEWLINE = String.fromCharCode(10);
  const BLANK = String.fromCharCode(0x2800);
  const inked = (text) => [...text.split(NEWLINE).join('')].filter((c) => c !== BLANK).length;

  const plainText = imageDataToBraille(edgeImage, { threshold: 128, method: 'threshold' });
  const linedText = imageDataToBraille(edgeImage, {
    threshold: 60, method: 'threshold', edge: { mode: 'xdog', amount: 1, radius: 1 },
  });
  ok('edge mode changes the output', plainText !== linedText);
  ok('a line uses far fewer cells than a filled half', inked(linedText) < inked(plainText) / 2,
     `${inked(linedText)} vs ${inked(plainText)} inked cells`);
  log.push(`INFO  xdog row: ${linedText.split(NEWLINE)[8].slice(10, 34)}`);

  // --- gamma ---------------------------------------------------------------
  const grey = (v) => {
    const image = new ImageData(W, H);
    for (let i = 0; i < image.data.length; i += 4) {
      image.data[i] = image.data[i + 1] = image.data[i + 2] = v;
      image.data[i + 3] = 255;
    }
    return image;
  };

  check('white is full luminance', Math.round(luminance(255, 255, 255)), 255);
  check('black is none', luminance(0, 0, 0), 0);
  // BT.709 on linear values. The old code applied BT.601 to gamma-encoded ones,
  // which put pure blue at 29 of 255 and pure green at 150.
  check('pure blue is as dark as it really is', Math.round(luminance(0, 0, 255)), 18);
  check('pure green is as light as it really is', Math.round(luminance(0, 255, 0)), 182);
  check('the threshold survives a round trip', Math.round(linearToThreshold(thresholdToLinear(128))), 128);

  // The point of the whole exercise: a dithered flat tone must come out at the
  // coverage that reproduces it. Half the dots lit emits half the light, so the
  // fraction has to match linear luminance -- 0.216 for sRGB mid-grey, not the
  // 0.5 that diffusing error over gamma-encoded values used to give.
  const midPlane = tonePlane(grey(128), {}).plane;
  const midCoverage = coverage(DITHER_METHODS['floyd-steinberg'](midPlane, W, H, thresholdToLinear(128)));
  near('mid-grey is dithered at its true coverage', midCoverage, 0.19, 0.24);
  ok('which is far from the old gamma-blind 0.5', Math.abs(midCoverage - 0.5) > 0.25,
     `${midCoverage.toFixed(3)} against 0.500`);

  const darkCoverage = coverage(DITHER_METHODS['floyd-steinberg'](tonePlane(grey(64), {}).plane, W, H, thresholdToLinear(128)));
  near('a quarter-tone likewise', darkCoverage, 0.03, 0.07);

  // Lightness is the perceptual scale: even steps of sRGB give even steps of L*,
  // while linear luminance bends hard. This is why edges are detected in one and
  // dots are counted in the other.
  const steps = [0, 64, 128, 192, 255];
  const lightnessSteps = steps.map((v) => lightness(v, v, v));
  const luminanceSteps = steps.map((v) => luminance(v, v, v));
  const evenness = (values) => {
    const gaps = values.slice(1).map((v, i) => v - values[i]);
    return Math.max(...gaps) / Math.min(...gaps);
  };
  ok('lightness rises evenly', evenness(lightnessSteps) < 1.5, `ratio ${evenness(lightnessSteps).toFixed(2)}`);
  ok('linear luminance does not', evenness(luminanceSteps) > 3, `ratio ${evenness(luminanceSteps).toFixed(2)}`);

  // A smooth ramp has no edges in it. Detecting in linear light made XDoG answer
  // to the gamma curve and ink the entire image; in lightness it stays quiet.
  const ramped = new ImageData(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const v = Math.round((x / (W - 1)) * 255);
      ramped.data[i] = ramped.data[i + 1] = ramped.data[i + 2] = v;
      ramped.data[i + 3] = 255;
    }
  }
  const rampLines = tonePlane(ramped, { edge: { mode: 'xdog', amount: 1, radius: 1 } });
  check('a line plane is not measured in light', rampLines.linear, false);
  const rampInk = coverage(binarize(rampLines.plane, W, H, { threshold: 40, method: 'threshold' }));
  ok('a smooth ramp reads as having no edges', rampInk < 0.05,
     `${(rampInk * 100).toFixed(1)}% of the frame lit`);

  // --- presets -------------------------------------------------------------
  // A preset must write every control it covers, or picking one twice lands
  // somewhere different depending on what was fiddled with in between.
  const REQUIRED = ['method', 'threshold', 'edgeMode', 'edgeAmount', 'edgeRadius',
    'brightness', 'contrast', 'saturation', 'sharpness', 'smooth'];
  let presetsComplete = true;
  let presetsValid = true;
  for (const [name, preset] of Object.entries(CONTENT_PRESETS)) {
    for (const key of REQUIRED) {
      if (!(key in preset.settings)) { presetsComplete = false; log.push(`      ${name} is missing ${key}`); }
    }
    const s = preset.settings;
    if (!(s.method in DITHER_METHODS)) presetsValid = false;
    if (!EDGE_MODES.includes(s.edgeMode)) presetsValid = false;
    if (s.threshold < 0 || s.threshold > 255) presetsValid = false;
    if (s.sharpness < 0 || s.sharpness > 5) presetsValid = false;
    if (Math.abs(s.contrast) > 100 || Math.abs(s.brightness) > 100) presetsValid = false;
  }
  check('every preset sets every control', presetsComplete, true);
  check('every preset value is in range', presetsValid, true);
  check('line-art preset actually turns lines on', CONTENT_PRESETS.lineart.settings.edgeMode, 'xdog');
  check('pixel-art preset turns interpolation off', CONTENT_PRESETS.pixel.settings.smooth, false);
  check('photo preset dithers', CONTENT_PRESETS.photo.settings.method, 'floyd-steinberg');

  // --- platform arithmetic -------------------------------------------------
  const sample = 'AB';
  check('plain paste costs what it says', messageLength(sample, 'none'), 2);
  // three backticks, a newline, the art, a newline, three backticks
  check('a code block costs eight more', messageLength(sample, 'discord'), 10);
  check('wrapping produces four lines for a two-line art',
    forPlatform('a' + String.fromCharCode(10) + 'b', 'discord').split(String.fromCharCode(10)).length, 4);
  check('no wrapping where the target takes none', forPlatform(sample, 'none'), sample);
  check('discord limit is the documented one', PLATFORMS.discord.limit, 2000);
  check('telegram limit is the documented one', PLATFORMS.telegram.limit, 4096);
  ok('no platform ships a guessed width',
    Object.values(PLATFORMS).every((p) => !('defaultWidth' in p) && !('width' in p)));

  {
    // --- trimming blank margins ---------------------------------------------
    const BLANK_CELL = String.fromCharCode(0x2800);
    const FULL_CELL = String.fromCharCode(0x28FF);
    const NEWLINE = String.fromCharCode(10);
    const rows2d = (grid) => grid.map((row) => [...row].map((c) => (c === '#' ? FULL_CELL : BLANK_CELL)).join('')).join(NEWLINE);

    const bordered = rows2d(['....', '..#.', '.##.', '....']);
    check('margins go', trimBlank(bordered), rows2d(['.#', '##']));
    check('trimming saves characters', bordered.length - trimBlank(bordered).length, 14);
    check('an empty frame trims to nothing', trimBlank(rows2d(['..', '..'])), '');
    check('a full frame is left alone', trimBlank(rows2d(['##', '##'])), rows2d(['##', '##']));

    // A column only goes when it is empty in every row, or the picture shears.
    const gap = rows2d(['#..#', '#..#']);
    check('an interior gap is kept', trimBlank(gap), gap);
    check('one lit cell survives', trimBlank(rows2d(['...', '.#.', '...'])), FULL_CELL);

    // --- splitting into messages --------------------------------------------
    const wide = Array.from({ length: 40 }, () => FULL_CELL.repeat(80)).join(NEWLINE);
    check('a short art is one message', splitForPlatform(FULL_CELL.repeat(10), 'discord').length, 1);
    check('no limit means no splitting', splitForPlatform(wide, 'none').length, 1);

    const pieces = splitForPlatform(wide, 'discord');
    ok('an oversized art is divided', pieces.length > 1, `${pieces.length} messages`);
    ok('every piece is inside the limit', partsFit(pieces, 'discord'),
       pieces.map((p) => messageLength(p, 'discord')).join(', '));
    check('nothing is lost or duplicated',
      pieces.join(NEWLINE).split(NEWLINE).length, wide.split(NEWLINE).length);

    // Splitting anywhere but a row boundary would leave the halves misaligned
    // when they arrive as separate messages.
    const originalRows = wide.split(NEWLINE);
    ok('pieces are made of whole rows',
       pieces.every((piece) => piece.split(NEWLINE).every((row) => originalRows.includes(row))));

    // A row wider than the whole limit cannot be divided further; the caller has
    // to be able to see that rather than be handed a silent failure.
    const monstrous = FULL_CELL.repeat(3000);
    check('an undividable row comes back whole', splitForPlatform(monstrous, 'discord').length, 1);
    check('and is reported as not fitting', partsFit(splitForPlatform(monstrous, 'discord'), 'discord'), false);

  }

  // --- the ruler measures braille, not digits ------------------------------
  const marks = ruler(50);
  check('ruler is the requested length', marks.length, 50);
  check('ruler is made of braille cells', /^[⠀-⣿]+$/.test(marks), true);
  check('ruler marks every tenth cell', [...marks].filter((c) => c === String.fromCharCode(0x28FF)).length, 5);

  // --- calibration round-trip ----------------------------------------------
  clearCalibration('discord');
  check('unmeasured platform reports no width', calibrationOf('discord').width, null);
  check('unmeasured platform defaults to scale 1', calibrationOf('discord').scale, 1);
  saveCalibration('discord', { width: 37, scale: 1.25 });
  check('measured width comes back', calibrationOf('discord').width, 37);
  check('measured scale comes back', calibrationOf('discord').scale, 1.25);
  clearCalibration('discord');
  check('clearing forgets the width', calibrationOf('discord').width, null);

  // --- SVG export ----------------------------------------------------------
  const NL = String.fromCharCode(10);
  const svg = brailleToSvg('⣿⣿⣿' + NL + '⣿', {
    fontFamily: 'monospace', fontSize: 16, lineHeight: 1,
    foreground: 'rgb(230, 255, 243)', background: 'rgb(0, 18, 10)',
  });
  const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
  check('svg parses as XML', doc.querySelector('parsererror'), null);
  check('svg has one text element per line', doc.querySelectorAll('text').length, 2);
  check('svg keeps whitespace', doc.querySelector('text').getAttribute('xml:space'), 'preserve');
  ok('svg is sized off the widest line, not line 0',
     Number(doc.documentElement.getAttribute('width')) > 16,
     `${doc.documentElement.getAttribute('width')}px wide`);
  check('svg height covers both rows', doc.documentElement.getAttribute('height'), '32');
  ok('svg stays small: it draws lines, not a shape per dot', svg.length < 1000, `${svg.length} bytes`);

  // --- cropping ------------------------------------------------------------
  // Four flat quadrants, so a selection can be checked by colour alone.
  const quad = createCanvas(100, 100);
  const qx = quad.getContext('2d');
  qx.fillStyle = '#ff0000'; qx.fillRect(0, 0, 50, 50);
  qx.fillStyle = '#00ff00'; qx.fillRect(50, 0, 50, 50);
  qx.fillStyle = '#0000ff'; qx.fillRect(0, 50, 50, 50);
  qx.fillStyle = '#ffffff'; qx.fillRect(50, 50, 50, 50);

  const dominant = (image) => {
    const seen = new Map();
    for (let i = 0; i < image.data.length; i += 4) {
      const key = `${image.data[i]},${image.data[i + 1]},${image.data[i + 2]}`;
      seen.set(key, (seen.get(key) ?? 0) + 1);
    }
    return [...seen.entries()].sort((a, b) => b[1] - a[1])[0];
  };

  const whole = readImageData(drawScaled(quad, 20, 20, '#000000'));
  const topLeft = readImageData(drawScaled(quad, 20, 20, '#000000', { crop: { x: 0, y: 0, w: 0.5, h: 0.5 } }));
  const bottomRight = readImageData(drawScaled(quad, 20, 20, '#000000', { crop: { x: 0.5, y: 0.5, w: 0.5, h: 0.5 } }));

  check('the top-left selection is entirely red', dominant(topLeft)[0], '255,0,0');
  check('nothing but the selection survives', dominant(topLeft)[1], 400);
  check('the bottom-right selection is entirely white', dominant(bottomRight)[0], '255,255,255');
  ok('no selection keeps all four quadrants', dominant(whole)[1] < 400,
     `largest run ${dominant(whole)[1]} of 400`);

  // A selection is cut from the original before any scaling, so detail is not
  // first thrown away and then magnified.
  const detail = createCanvas(400, 400);
  const dx = detail.getContext('2d');
  dx.fillStyle = '#000'; dx.fillRect(0, 0, 400, 400);
  dx.fillStyle = '#fff';
  for (let i = 0; i < 40; i++) dx.fillRect(i * 10, 0, 5, 400);
  const zoomed = readImageData(drawScaled(detail, 40, 40, '#000000', { crop: { x: 0, y: 0, w: 0.1, h: 0.1 } }));
  const spread = dominant(zoomed);
  ok('a tight selection is sampled from the original, not from a preview',
     spread[1] < 1600, `largest flat run ${spread[1]} of 1600`);

  check('FULL_FRAME covers everything', isWholeImage(FULL_FRAME), true);
  check('null counts as the whole frame', isWholeImage(null), true);
  check('a real selection does not', isWholeImage({ x: 0.1, y: 0.1, w: 0.5, h: 0.5 }), false);

  {
    // --- colour per cell ----------------------------------------------------
    // One cell, 2x4. Four white pixels and four black ones.
    const cell = new ImageData(2, 4);
    for (let i = 0; i < 8; i++) {
      const v = i < 4 ? 255 : 0;
      cell.data[i * 4] = cell.data[i * 4 + 1] = cell.data[i * 4 + 2] = v;
      cell.data[i * 4 + 3] = 255;
    }

    // With every dot raised the average covers all eight pixels. Half white and
    // half black is half the *light*, which is sRGB 188 -- averaging the encoded
    // channels instead would say 128, the same mistake as dithering over them.
    const allLit = cellColours(cell, new Uint8Array(8).fill(1), 1, 1);
    ok('an even mix averages in linear light', Math.abs(allLit[0] - 188) <= 2,
       `${allLit[0]}, sRGB averaging would say 128`);

    // Only the raised dots are drawn, so only they are averaged: otherwise the
    // unlit background drags every cell toward itself and washes the art out.
    const litWhites = new Uint8Array(8);
    for (let i = 0; i < 4; i++) litWhites[i] = 1;
    const onlyLit = cellColours(cell, litWhites, 1, 1);
    check('only raised dots are averaged', onlyLit[0], 255);

    const red = new ImageData(2, 4);
    for (let i = 0; i < 8; i++) {
      red.data[i * 4] = 255;
      red.data[i * 4 + 3] = 255;
    }
    const redCell = cellColours(red, new Uint8Array(8).fill(1), 1, 1);
    check('a flat colour survives intact', `${redCell[0]},${redCell[1]},${redCell[2]}`, '255,0,0');
    check('and reads as hex', cellHex(redCell, 0), '#ff0000');

    // --- runs ---------------------------------------------------------------
    const flatRow = new Uint8ClampedArray([10, 20, 30, 10, 20, 30, 10, 20, 30, 10, 20, 30]);
    check('equal cells collapse to one run', colourRuns(flatRow, 0, 4).length, 1);

    const split = new Uint8ClampedArray([10, 20, 30, 10, 20, 30, 200, 20, 30, 200, 20, 30]);
    const runs = colourRuns(split, 0, 4);
    check('a change starts a new run', runs.length, 2);
    check('runs cover the row', runs.at(-1).end, 4);
    check('the first run stops at the change', runs[0].end, 2);

    const drifting = new Uint8ClampedArray([10, 20, 30, 14, 20, 30, 18, 20, 30, 22, 20, 30]);
    ok('a slow drift is broken up rather than claimed whole',
       colourRuns(drifting, 0, 4, 8).length > 1,
       `${colourRuns(drifting, 0, 4, 8).length} runs`);

    // --- coloured formats ---------------------------------------------------
    const NL = String.fromCharCode(10);
    const FULL = String.fromCharCode(0x28FF);
    const artText = FULL.repeat(2) + NL + FULL.repeat(2);
    const artColours = new Uint8ClampedArray([
      255, 0, 0, 0, 255, 0,
      0, 0, 255, 255, 255, 0,
    ]);

    const html = brailleToHtml(artText, artColours, 2, {
      fontFamily: 'monospace', fontSize: 12, lineHeight: 1,
      foreground: '#fff', background: '#000',
    });
    ok('html carries the colours', html.includes('#ff0000') && html.includes('#00ff00'), '');
    ok('html carries the background', html.includes('background:#000'));
    check('html spans one per run', (html.match(/<span/g) ?? []).length, 4);

    const ansi = brailleToAnsi(artText, artColours, 2);
    const ESC = String.fromCharCode(27);
    ok('ansi uses 24-bit colour', ansi.includes(`${ESC}[38;2;255;0;0m`), '');
    check('ansi resets on every line', (ansi.match(new RegExp(`${ESC}\\[0m`, 'g')) ?? []).length, 2);
    ok('ansi keeps the glyphs', ansi.includes(FULL));

    // Without colours these must still produce something usable.
    ok('html without colour is still a page', brailleToHtml(artText, null, 2, {
      fontFamily: 'monospace', fontSize: 12, lineHeight: 1, foreground: '#fff', background: '#000',
    }).includes(FULL));
    check('ansi without colour is the plain text', brailleToAnsi(artText, null, 2), artText + NL);

    // --- the encoder only pays for colour when asked ------------------------
    const sample = new ImageData(4, 8);
    for (let i = 0; i < sample.data.length; i += 4) {
      sample.data[i] = 200; sample.data[i + 1] = 100; sample.data[i + 2] = 50; sample.data[i + 3] = 255;
    }
    check('no colours unless requested', encode(sample, { threshold: 128 }).colours, null);
    const coloured = encode(sample, { threshold: 128, colour: true });
    check('colours come back one triple per cell', coloured.colours.length, coloured.cols * coloured.rows * 3);
    check('the text is the same either way', coloured.text, encode(sample, { threshold: 128 }).text);
  }

  {
    // --- translation --------------------------------------------------------
    const codes = Object.keys(LOCALES);
    ok('more than one language is offered', codes.length >= 2, codes.join(', '));

    // Every dictionary must answer every key. A gap would silently fall back to
    // English in one place and not another, which reads as a bug rather than as
    // a missing translation.
    const keysOf = (code) => new Set(Object.keys(LOCALES[code].strings));
    const reference = keysOf(FALLBACK);
    for (const code of codes) {
      const here = keysOf(code);
      const missing = [...reference].filter((key) => !here.has(key));
      const extra = [...here].filter((key) => !reference.has(key));
      check(`${code}: nothing missing`, missing.join(', '), '');
      check(`${code}: nothing left over`, extra.join(', '), '');
    }
    ok('every language declares a tag and a name',
       codes.every((code) => LOCALES[code].tag && LOCALES[code].name));

    // The markup asks for keys by name; each one has to exist.
    const markup = await (await fetch('/index.html')).text();
    const asked = [...markup.matchAll(/data-i18n(?:-title|-label)?="([^"]+)"/g)].map((m) => m[1]);
    ok('the markup asks for keys at all', asked.length > 50, `${asked.length} places`);
    const unknown = [...new Set(asked)].filter((key) => !reference.has(key));
    check('every key the markup asks for exists', unknown.join(', '), '');

    // So do the things named from data: presets, targets, typefaces.
    const named = [
      ...Object.keys(CONTENT_PRESETS).flatMap((key) => [`preset.${key}`, `preset.${key}.hint`]),
      ...Object.keys(PLATFORMS).map((key) => `platform.${key}`),
      ...Object.keys(TEXT_FONTS).map((key) => `font.${key}`),
      ...Object.keys(DITHER_METHODS).map((key) => `dither.${key}`),
      ...EDGE_MODES.map((mode) => `edges.${mode}`),
    ];
    const unnamed = named.filter((key) => !reference.has(key));
    check('everything chosen from data has a name', unnamed.join(', '), '');

    // No dictionary should still be carrying a name the data no longer uses.
    ok('presets carry settings only, not words',
       Object.values(CONTENT_PRESETS).every((preset) => !('label' in preset) && !('hint' in preset)));
    ok('targets carry facts only', Object.values(PLATFORMS).every((target) => !('label' in target)));
    ok('typefaces carry stacks only', Object.values(TEXT_FONTS).every((font) => !('label' in font)));

    // --- plurals ------------------------------------------------------------
    // The reason Intl.PluralRules is here rather than a count-of-one test:
    // Russian needs three forms where English needs two.
    setLocale('ru');
    const russian = [1, 2, 5, 21, 105].map((count) => t('meta.characters', { count }));
    ok('russian uses one form for 1', /^1 знак /.test(russian[0]), russian[0]);
    ok('russian uses another for 2', /^2 знака /.test(russian[1]), russian[1]);
    ok('russian uses a third for 5', /^5 знаков /.test(russian[2]), russian[2]);
    ok('and 21 goes back to the first', /^21 знак /.test(russian[3]), russian[3]);
    ok('while 105 takes the third', /^105 знаков /.test(russian[4]), russian[4]);

    setLocale('en');
    ok('english has a singular', /^1 character /.test(t('meta.characters', { count: 1 })));
    ok('english has a plural', /^2 characters /.test(t('meta.characters', { count: 2 })));

    // --- numbers and interpolation -----------------------------------------
    setLocale('ru');
    ok('russian groups thousands its own way', formatNumber(1234567).includes(String.fromCharCode(160)),
       JSON.stringify(formatNumber(1234567)));
    setLocale('en');
    check('english groups with commas', formatNumber(1234567), '1,234,567');

    check('values are put into the sentence', t('threshold.picked', { value: 156 }), 'Threshold chosen: 156.');
    check('an unknown placeholder is left alone', t('camera.failed', {}), 'Camera: {reason}.');

    // --- gaps are visible, not silent --------------------------------------
    check('a missing key shows itself', t('no.such.key'), 'no.such.key');

    setLocale('en');
  }

  {
    // --- settings in a link -------------------------------------------------
    const settings = {
      mode: 'advanced', layout: 'focus', language: 'ru', sourceKind: 'text',
      preset: 'lineart', platform: 'discord', dither: 'atkinson', invert: '1',
      edgeMode: 'xdog', outWidth: '120', outHeight: '44', fontSize: '14',
      threshold: 90, brightness: -10, contrast: 25, saturation: 0, sharpness: 1.5,
      edgeAmount: 60, edgeRadius: 1.4,
      keepAspect: true, trimBlank: false, colour: true, smooth: false, textBold: true,
      textFont: 'display', textInput: 'HELLO',
    };

    const hash = toHash(settings);
    const back = fromHash(hash);

    ok('the keys are short and readable', hash.startsWith('m=advanced&l=focus'), hash.slice(0, 40));
    ok('nothing is lost on the way back',
       Object.keys(settings).every((key) => String(back[key]) === String(settings[key])),
       Object.keys(settings).filter((key) => String(back[key]) !== String(settings[key])).join(', '));

    // Booleans have to come back as booleans, not as the strings "1" and "0":
    // applySettings tests their type.
    check('true survives as true', back.keepAspect, true);
    check('false survives as false', back.trimBlank, false);
    ok('and they are written compactly', hash.includes('ka=1') && hash.includes('tr=0'));

    check('a leading hash is accepted', fromHash('#w=42').outWidth, '42');
    check('so is a bare fragment', fromHash('w=42').outWidth, '42');
    check('an empty one yields nothing', Object.keys(fromHash('')).length, 0);

    // A link written by a later version should still work here, minus whatever
    // this version cannot do.
    const mixed = fromHash('w=42&nosuchkey=7&d=bayer4');
    check('unknown keys are ignored', Object.keys(mixed).sort().join(','), 'dither,outWidth');
    check('and the known ones still arrive', mixed.dither, 'bayer4');

    // One bad escape should not throw away the rest of the link.
    const damaged = fromHash('w=42&txt=%E0%A4%A&d=atkinson');
    check('a malformed value is skipped, not fatal', damaged.outWidth, '42');
    check('and the rest is kept', damaged.dither, 'atkinson');

    check('empty values are left out', toHash({ outWidth: '', dither: 'atkinson' }), 'd=atkinson');
    ok('values are escaped', toHash({ textInput: 'a b&c=d' }).includes('a%20b%26c%3Dd'),
       toHash({ textInput: 'a b&c=d' }));
    check('a round trip survives the escaping', fromHash(toHash({ textInput: 'a b&c=d' })).textInput, 'a b&c=d');

    // Lettering long enough to make the link useless is left out of it.
    const wordy = { outWidth: '80', textInput: 'x'.repeat(500) };
    ok('very long lettering is dropped', !toHash(wordy).includes('txt='), toHash(wordy));
    check('and the caller can say so', textFits(wordy), false);
    check('while ordinary lettering fits', textFits({ textInput: 'HELLO' }), true);
    ok('the rest of the settings still travel', toHash(wordy).includes('w=80'));
  }

  // --- offline shell -------------------------------------------------------
  const manifest = await (await fetch('/manifest.webmanifest')).json();
  check('the manifest names the app', manifest.name, 'Braille Art Generator');
  check('the manifest opens standalone', manifest.display, 'standalone');
  check('the manifest scopes itself relatively', manifest.scope, './');
  ok('the manifest offers a maskable icon',
     manifest.icons.some((icon) => icon.purpose === 'maskable'));

  const swSource = await (await fetch('/sw.js')).text();
  const listed = [...swSource.matchAll(/'(\.\/[^']*)'/g)].map((m) => m[1].replace('./', '/'));
  ok('the service worker precaches the whole shell', listed.length > 15, `${listed.length} entries`);

  // Every precached URL must actually exist, or install() rejects and the app
  // silently never works offline.
  const statuses = await Promise.all(listed.map(async (url) => {
    const response = await fetch(url, { method: 'GET' });
    return { url, ok: response.ok };
  }));
  const broken = statuses.filter((entry) => !entry.ok).map((entry) => entry.url);
  ok('every precached URL resolves', broken.length === 0, broken.join(', ') || `${statuses.length} checked`);

  // Walking the real module graph, because "every listed file exists" says
  // nothing about a file that was never listed -- which is exactly how two
  // modules quietly stayed out of the offline shell.
  async function moduleGraph(entry) {
    const reached = new Set();
    const pending = [entry];

    while (pending.length > 0) {
      const url = pending.pop();
      if (reached.has(url)) continue;
      reached.add(url);

      const source = await (await fetch(url)).text();
      const specifiers = [
        ...[...source.matchAll(/from\s+'([^']+)'/g)].map((m) => m[1]),
        // workers are addressed by URL rather than imported
        ...[...source.matchAll(/new URL\('([^']+)'/g)].map((m) => m[1]),
      ];
      for (const specifier of specifiers) {
        if (!specifier.startsWith('.')) continue;
        pending.push(new URL(specifier, new URL(url, location.origin)).pathname);
      }
    }
    return [...reached];
  }

  const reachable = await moduleGraph('/src/main.js');
  const unlisted = reachable.filter((url) => !listed.includes(url));
  ok('every module the app loads is in the offline shell', unlisted.length === 0,
     unlisted.join(', ') || `${reachable.length} modules reached`);

  // The list drifts the moment a module is added, so compare it with what the
  // page actually imports.
  const pageSource = await (await fetch('/index.html')).text();
  ok('the shell list includes the entry module', listed.includes('/src/main.js'));
  ok('the page links the manifest', pageSource.includes('rel="manifest"'));

  // --- text as a source image ----------------------------------------------
  const lettering = renderText('AB', { font: 'display', bold: true });
  ok('text renders to a canvas', lettering instanceof HTMLCanvasElement);
  ok('the canvas is large enough to reduce from', lettering.width > 100 && lettering.height > 100,
     `${lettering.width}×${lettering.height}`);

  const letteringPixels = readImageData(lettering);
  let lit = 0;
  let dark = 0;
  for (let i = 0; i < letteringPixels.data.length; i += 4) {
    if (letteringPixels.data[i] > 200) lit++;
    if (letteringPixels.data[i] < 40) dark++;
  }
  ok('letters are drawn light on dark', lit > 0 && dark > lit,
     `${lit} light, ${dark} dark`);
  check('the canvas is opaque', letteringPixels.data[3], 255);

  ok('a longer string is wider', renderText('AAAAAA').width > renderText('A').width);
  ok('a second line makes it taller', renderText('A\nB').height > renderText('A').height);
  ok('every offered font has a stack', Object.values(TEXT_FONTS).every((font) => font.stack));
  ok('the default font is one of them', DEFAULT_TEXT_FONT in TEXT_FONTS);

  // Empty input must not produce a zero-sized canvas that later divides by zero.
  const blank = renderText('');
  ok('empty text still yields a usable canvas', blank.width >= 1 && blank.height >= 1,
     `${blank.width}×${blank.height}`);

  // Lettering must survive the ordinary pipeline, since that is the whole point
  // of drawing it to a canvas rather than carrying a bitmap font.
  const asArt = imageDataToBraille(
    readImageData(drawScaled(lettering, 60, 20, '#000000')),
    { threshold: 128, method: 'threshold' },
  );
  const inkedCells = [...asArt.split(String.fromCharCode(10)).join('')]
    .filter((ch) => ch !== String.fromCharCode(0x2800)).length;
  ok('lettering encodes to braille through the normal path', inkedCells > 20,
     `${inkedCells} inked cells`);
  log.push(`INFO  lettering row: ${asArt.split(String.fromCharCode(10))[2]}`);

  // --- worker must agree with the main thread exactly ----------------------
  const pipe = createPipeline();
  check('worker is available', pipe.offThread, true);

  const makeImage = () => {
    const img = new ImageData(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4, v = Math.round(((x + y) / (W + H - 2)) * 255);
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    return img;
  };
  const params = { brightness: 10, contrast: 20, saturation: 0, sharpness: 1.5 };
  const options = { threshold: 120, invert: false, method: 'atkinson' };

  const expectedText = imageDataToBraille(applyAdjustments(makeImage(), params), options);
  const fromWorker = await pipe.generate(makeImage(), params, options);
  check('worker output matches main thread byte for byte', fromWorker.text === expectedText, true);
  check('worker returns the pixels it encoded', fromWorker.pixels.width, W);
  log.push(`INFO  sample row: ${fromWorker.text.split('\n')[8].slice(0, 24)}`);

  // The pipeline reports in the slider's units, so the reference has to make
  // the same crossing back out of linear light.
  const reference = tonePlane(applyAdjustments(makeImage(), params), options);
  const expectedOtsu = Math.round(reference.linear
    ? linearToThreshold(otsuThreshold(reference.plane))
    : otsuThreshold(reference.plane));
  check('worker otsu matches main thread', await pipe.otsu(makeImage(), params), expectedOtsu);

  // --- preview round-trip through the worker -------------------------------
  await pipe.setPreview(makeImage());
  const preview = await pipe.preview(params);
  check('worker preview returns full-size pixels', preview.width * preview.height, W * H);
  const expectedPreview = applyAdjustments(makeImage(), params);
  let identical = true;
  for (let i = 0; i < preview.data.length; i++) if (preview.data[i] !== expectedPreview.data[i]) identical = false;
  check('worker preview matches main thread', identical, true);

  const failed = log.filter((l) => l.startsWith('FAIL')).length;
  out(`${log.join('\n')}\n${failed ? `\n${failed} FAILED` : '\nAll pipeline checks passed.'}`);
}

run().catch((err) => out(`THREW: ${err?.stack ?? err}\n\n--- progress ---\n${log.join('\n')}`));
</script>
</body>
</html>
