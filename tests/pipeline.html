  // just holds is a rule about this fixture rather than about pictures.
  {
    const painted = (w, h, paint) => {
      const canvas = createCanvas(w, h);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      paint(ctx, w, h);
      return readImageData(canvas);
    };

    const pixelArt = () => {
      const small = createCanvas(16, 16);
      const s = small.getContext('2d');
      const palette = ['#1b1b2f', '#e94560', '#f5f5f5', '#16213e', '#0f3460'];
      for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
          s.fillStyle = palette[(x * 3 + y * 5 + ((x * y) % 4)) % palette.length];
          s.fillRect(x, y, 1, 1);
        }
      }
      return painted(256, 256, (ctx, w, h) => {
        // Sharp, as pixel art is always shown: this is the evidence itself.
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(small, 0, 0, w, h);
      });
    };

    const logo = () => painted(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#2b6cb0'; ctx.beginPath(); ctx.arc(128, 110, 70, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(128, 110, 35, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a202c'; ctx.fillRect(60, 200, 136, 23);
    });

    const drawing = () => painted(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#111111'; ctx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        ctx.beginPath();
        ctx.moveTo(20 + i * 6, 30);
        ctx.bezierCurveTo(200, 50 + i * 10, 40, 150 + i * 4, 230 - i * 5, 230);
        ctx.stroke();
      }
      for (let i = 0; i < 30; i++) {
        ctx.beginPath(); ctx.moveTo(30, 40 + i * 3); ctx.lineTo(100, 45 + i * 3); ctx.stroke();
      }
    });

    // Continuous tone with texture everywhere, which is what a photograph is
    // to every one of these measures.
    const photo = () => painted(256, 256, (ctx, w, h) => {
      const image = ctx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const shade = 90 + 60 * Math.sin(x / 40) * Math.cos(y / 55) + (Math.random() - 0.5) * 50;
          image.data[i] = shade + 12; image.data[i + 1] = shade; image.data[i + 2] = shade - 18;
          image.data[i + 3] = 255;
        }
      }
      ctx.putImageData(image, 0, 0);
    });

    for (const [want, make] of [['pixel', pixelArt], ['logo', logo], ['lineart', drawing], ['photo', photo]]) {
      const { kind, features } = classifyImage(make());
      check(`${want} is recognised`, kind, want);
      ok(`  and by how much: ${want}`, true,
         `twins ${(features.twins * 100).toFixed(0)}%, ends ${(features.extremes * 100).toFixed(0)}%,`
         + ` busy ${(features.busy * 100).toFixed(0)}%, flat ${(features.flat * 100).toFixed(0)}%`);
    }

    // Every kind the detector can name has a preset to apply.
    ok('every kind has a preset', IMAGE_KINDS.every((kind) => CONTENT_PRESETS[kind]),
       IMAGE_KINDS.filter((kind) => !CONTENT_PRESETS[kind]).join(', ') || IMAGE_KINDS.join(', '));

    // Pixel art is known by its repeated columns, and the whole point of the
    // measurement is that saving the file must not destroy the evidence. An
    // earlier attempt keyed on the regularity of the spacing instead; it read
    // 100% clean and 0% after one JPEG, which is why it is not here.
    const asJpeg = (imageData) => new Promise((resolve) => {
      const canvas = createCanvas(imageData.width, imageData.height);
      canvas.getContext('2d').putImageData(imageData, 0, 0);
      const img = new Image();
      img.onload = () => {
        const back = createCanvas(imageData.width, imageData.height);
        const ctx = back.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0);
        resolve(readImageData(back));
      };
      img.src = canvas.toDataURL('image/jpeg', 0.85);
    });
    const saved = classifyImage(await asJpeg(pixelArt()));
    check('and it survives being saved as jpeg', saved.kind, 'pixel');

    // Features stay in their own units whatever comes in.
    const odd = imageFeatures(painted(1, 40, (ctx) => { ctx.fillStyle = '#888'; ctx.fillRect(0, 0, 1, 40); }));
    ok('a one-pixel column does not divide by zero',
       Object.values(odd).every((v) => Number.isFinite(v) && v >= 0 && v <= 1),
       Object.entries(odd).map(([k, v]) => `${k} ${v.toFixed(2)}`).join(', '));
  }

  // --- weighing one art against another ------------------------------------
  {
    const flat = (value) => new Float32Array(W * H).fill(value);
    const level = thresholdToLinear(128);

    // A ramp, which is where the methods differ most.
    const slope = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) slope[y * W + x] = (x / (W - 1)) * 255;

    const scoreOf = (method, plane) =>
      scoreArt(DITHER_METHODS[method](plane, W, H, level, level), W, H, plane);

    // The ordering the eye gives, and the numbers agree: error diffusion holds
    // a ramp, ordered dithering holds it in sixteen steps, a single threshold
    // throws half of it away.
    const diffused = scoreOf('floyd-steinberg', slope);
    const ordered = scoreOf('bayer4', slope);
    const cut = scoreOf('threshold', slope);
    ok('diffusion beats a bare threshold on a ramp', diffused > cut, `${diffused.toFixed(3)} against ${cut.toFixed(3)}`);
    ok('and ordered dithering sits between them', ordered > cut && ordered < diffused,
       `${ordered.toFixed(3)} between ${cut.toFixed(3)} and ${diffused.toFixed(3)}`);

    // Tone alone must not be enough to win. A hard threshold turns flat grey
    // into a solid field, which has no structure to be wrong about -- and
    // structural similarity alone called that 0.73 until tone was folded in.
    const solid = scoreArt(DITHER_METHODS.threshold(flat(110), W, H, level, level), W, H, flat(110));
    ok('a solid field does not pass for a flat tone', solid < 0.5, solid.toFixed(3));

    check('an exact match agrees on tone', toneAgreement(flat(80), flat(80)), 1);
    near('and being 255 out agrees on nothing', toneAgreement(flat(0), flat(255)), 0, 0);
    near('a plane is identical to itself', similarity(slope, slope, W, H), 0.999, 1.001);

    // Too little blur and the comparison is looking at single dots rather than
    // at the picture: measured, the ordering inverts below about one dot.
    const sharp = scoreArt(DITHER_METHODS['floyd-steinberg'](slope, W, H, level, level), W, H, slope, 0.3);
    ok('the viewing distance is far enough to see past the dots', diffused > sharp,
       `${diffused.toFixed(3)} at ${VIEWING_BLUR} against ${sharp.toFixed(3)} up close`);
  }

  // --- a drawing judged as a drawing ---------------------------------------
  // Measured over 48 draws across four pictures, a line variant was offered
  // exactly never: it is scored against the light, and light is the one thing a
  // line drawing does not reproduce, so it came out at 0.00 every time and the
  // quality floor threw it away. The version before that had just spent its
  // whole length making those lines good.
  {
    const W2 = 64, H2 = 64;
    const ink = new Float32Array(W2 * H2);
    const bits = new Uint8Array(W2 * H2);
    // A contour down the middle, and an art that draws exactly that.
    for (let y = 0; y < H2; y++) {
      for (let x = 30; x <= 33; x++) { ink[y * W2 + x] = 255; bits[y * W2 + x] = 1; }
    }
    near('ink on the contour scores near one', contourAgreement(bits, ink, W2, H2), 0.9, 1);

    // The same amount of ink, in the wrong place.
    const misplaced = new Uint8Array(W2 * H2);
    for (let y = 0; y < H2; y++) for (let x = 5; x <= 8; x++) misplaced[y * W2 + x] = 1;
    ok('ink somewhere else scores far lower',
       contourAgreement(misplaced, ink, W2, H2) < 0.2,
       contourAgreement(misplaced, ink, W2, H2).toFixed(3));

    // Drawing nothing, and drawing everything, are both wrong in their own way.
    check('drawing nothing scores nothing', contourAgreement(new Uint8Array(W2 * H2), ink, W2, H2), 0);
    ok('drawing everywhere is punished by precision',
       contourAgreement(new Uint8Array(W2 * H2).fill(1), ink, W2, H2) < 0.5,
       contourAgreement(new Uint8Array(W2 * H2).fill(1), ink, W2, H2).toFixed(3));
  }

  // --- four variants worth offering ----------------------------------------
  {
    const canvas = createCanvas(120, 80);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const shaded = ctx.createImageData(120, 80);
    for (let y = 0; y < 80; y++) {
      for (let x = 0; x < 120; x++) {
        const i = (y * 120 + x) * 4;
        const shade = 40 + 170 * (x / 119) + 30 * Math.sin(y / 6);
        shaded.data[i] = shaded.data[i + 1] = shaded.data[i + 2] = shade;
        shaded.data[i + 3] = 255;
      }
    }
    ctx.putImageData(shaded, 0, 0);
    const pixels = readImageData(canvas);

    const grid = { cols: 30, rows: 10 };
    const reference = referenceFor(pixels, grid.cols, grid.rows);
    const options = { grid, threshold: 128 };
    const chosen = chooseVariants(pixels, options, reference, 4, seededRandom(1));

    check('four are offered', chosen.length, 4);

    // A picture with nothing much to draw must not spend a square on a drawing:
    // the place is earned by finding the contours better than the best tonal
    // candidate already does, and on a smooth ramp no drawing can.
    const smooth = chooseVariants(pixels, options, reference, 4, seededRandom(3), contourFor(pixels, grid.cols, grid.rows));
    ok('a drawing takes a place only when there is something to draw',
       smooth.every((entry) => entry.judge !== 'contour' || entry.score > 0.2),
       smooth.map((entry) => `${entry.key} ${entry.score.toFixed(2)}`).join(', '));
    ok('best first', chosen.every((entry, i) => i === 0 || chosen[i - 1].score >= entry.score),
       chosen.map((c) => c.score.toFixed(2)).join(' >= '));

    // The whole point of the diversity rule: four tiles showing the same
    // picture four times would be four wasted places.
    let closest = 1;
    for (let i = 0; i < chosen.length; i++) {
      for (let j = i + 1; j < chosen.length; j++) {
        closest = Math.min(closest, difference(chosen[i].bits, chosen[j].bits));
      }
    }
    ok('and no two are the same picture', closest >= DISTINCT,
       `closest pair differs by ${(closest * 100).toFixed(1)}% of dots, floor is ${DISTINCT * 100}%`);

    ok('each carries the art itself', chosen.every((entry) => entry.text.split(String.fromCharCode(10)).length === grid.rows),
       chosen.map((entry) => entry.text.split(String.fromCharCode(10)).length).join(', '));

    // Every family has to be nameable, in both languages, or a tile comes up
    // blank precisely when the draw happens to land on it.
    for (const locale of Object.keys(LOCALES)) {
      setLocale(locale);
      const unnamed = VARIANT_FAMILIES.filter((family) => t(`variant.${family.key}`) === `variant.${family.key}`);
      check(`${locale}: every family has a name`, unnamed.map((f) => f.key).join(','), '');
    }
    setLocale('ru');

    // --- drawn, not listed --------------------------------------------------
    // The point of drawing the spread is that pressing again is worth doing,
    // and the point of drawing it inside families is that what comes back is
    // still sensible. Both have to hold at once, so both are checked.
    const offersFor = (seed) => variantsOf(pixels, options, 4, seed);

    const first = offersFor(11);
    const shape = (offers) => offers.map((o) => `${o.key}:${o.score.toFixed(4)}`).join(' ');
    check('the same seed draws the same offers', shape(offersFor(11)), shape(first));

    let moved = 0;
    for (const seed of [12, 13, 14, 15, 16]) {
      const again = offersFor(seed);
      if (again.some((offer, i) => offer.text !== first[i]?.text)) moved++;
    }
    ok('a different draw offers something different', moved >= 4, `${moved} of 5 draws differed`);

    // Different tools, not one tool four times with the dials nudged. Four
    // distinct ways of working is what it reaches for, but not a promise it
    // can make: a family only takes a square by clearing the quality floor,
    // and on some pictures only three ever do. Then the fourth square goes to
    // the next best rather than to something nobody would choose -- which is
    // the trade the floor exists to make. Measured over six real pictures at
    // two widths, four families came up in 33 draws out of 36.
    const seeds = [11, 12, 13, 14, 15, 16, 17, 18];
    let leastFamilies = VARIANT_FAMILIES.length;
    let allFour = 0;
    let worstScore = 1;
    for (const seed of seeds) {
      const offers = offersFor(seed);
      const families = new Set(offers.map((o) => o.key)).size;
      leastFamilies = Math.min(leastFamilies, families);
      if (families === 4) allFour++;
      // Compared within a measure, not across: a tonal tile is scored against
      // the light and a drawing against the contours, and the two numbers are
      // answers to different questions. Racing them against each other is the
      // mistake this version exists to undo.
      const tonal = offers.filter((offer) => offer.judge !== 'contour').map((offer) => offer.score);
      if (tonal.length) worstScore = Math.min(worstScore, Math.min(...tonal) / (Math.max(...tonal) || 1));
    }
    ok('a draw never falls back on one or two ways of working', leastFamilies >= 3,
       `the narrowest draw offered ${leastFamilies} families`);
    ok('and mostly manages four', allFour >= seeds.length / 2, `${allFour} of ${seeds.length} draws`);
    ok('while none of them is far behind the best on the table', worstScore >= QUALITY_FLOOR - 0.001,
       `weakest sat at ${(worstScore * 100).toFixed(0)}% of its best, floor is ${QUALITY_FLOOR * 100}%`);

    // Each family must be able to produce a recipe every time it is asked.
    const drawn = sampleRecipes(seededRandom(7));
    check('every family is drawn', drawn.length, VARIANT_FAMILIES.length * DRAWS_PER_FAMILY);
    ok('and every draw is a usable recipe',
       drawn.every((recipe) => DITHER_METHODS[recipe.method] && recipe.detail >= 0 && recipe.detail <= 100
                    && EDGE_MODES.includes(recipe.edge.mode)),
       drawn.filter((recipe) => !DITHER_METHODS[recipe.method]).map((r) => r.method).join(',') || 'all sound');
  }

  // --- fewer colours, on purpose -------------------------------------------
  {
    // L*a*b* against values anyone can look up. Getting this wrong is quiet:
    // every match still returns something, just the wrong entry. It was wrong
    // once already -- white came back at L* 3.5 because the conversion divided
    // by 255 a second time.
    const near3 = (name, got, want) => ok(name, Math.abs(got - want) < 0.3, `${got.toFixed(1)} against ${want}`);
    near3('white is L* 100', lab(255, 255, 255)[0], 100);
    near3('and has no colour in it', lab(255, 255, 255)[1], 0);
    near3('red sits where the tables say', lab(255, 0, 0)[1], 80.1);
    near3('and green opposite it', lab(0, 255, 0)[1], -86.2);
    near3('blue is the deep one', lab(0, 0, 255)[2], -107.9);

    check('the terminal palettes are the sizes they claim', TERMINAL_PALETTES.ansi256.length / 3, 256);
    check('and sixteen is sixteen', TERMINAL_PALETTES.ansi16.length / 3, 16);

    // A colour already in the palette must come back unchanged, or every colour
    // in the picture drifts by an entry. Checked on the colour and not on the
    // index, because the xterm palette really does hold duplicates: entry 16 is
    // black again and 231 is white again, both already in the first sixteen. A
    // tie goes to the lower index, which is the better answer anyway -- the
    // plain sixteen are understood everywhere.
    const exact = [0, 9, 15, 16, 231, 232, 255];
    const drifted = exact.filter((index) => {
      const at = index * 3;
      const found = nearest(
        TERMINAL_PALETTES.ansi256,
        TERMINAL_PALETTES.ansi256[at], TERMINAL_PALETTES.ansi256[at + 1], TERMINAL_PALETTES.ansi256[at + 2],
      ) * 3;
      return TERMINAL_PALETTES.ansi256[found] !== TERMINAL_PALETTES.ansi256[at]
        || TERMINAL_PALETTES.ansi256[found + 1] !== TERMINAL_PALETTES.ansi256[at + 1]
        || TERMINAL_PALETTES.ansi256[found + 2] !== TERMINAL_PALETTES.ansi256[at + 2];
    });
    check('a palette colour comes back as itself', drifted.join(','), '');

    check('pure red picks the red', nearest(TERMINAL_PALETTES.ansi16, 250, 10, 10), 9);
    check('pure blue picks the blue', nearest(TERMINAL_PALETTES.ansi16, 10, 10, 250), 12);

    // The codes: sixteen colours are named directly, because a terminal that
    // has only sixteen prints "38;5;n" rather than obeying it.
    check('the first eight are the plain codes', ansiForeground('ansi16', 3), '33');
    check('the bright eight are the high ones', ansiForeground('ansi16', 11), '93');
    check('and 256 names an index', ansiForeground('ansi256', 200), '38;5;200');

    // Median cut spends its entries where the colours are.
    const twoBands = new Uint8ClampedArray(60 * 3);
    for (let cell = 0; cell < 60; cell++) {
      const at = cell * 3;
      if (cell < 30) { twoBands[at] = 200; twoBands[at + 1] = 30; twoBands[at + 2] = 30; }
      else { twoBands[at] = 30; twoBands[at + 1] = 60; twoBands[at + 2] = 200; }
    }
    const two = medianCut(twoBands, 2);
    check('two colours in, two colours out', two.length / 3, 2);
    ok('and it finds both of them',
       [0, 1].every((i) => two[i * 3] > 150 || two[i * 3 + 2] > 150)
       && two[0] !== two[3],
       [...two].join(','));

    // Asking for more entries than there are colours must not invent any.
    const flat = new Uint8ClampedArray([120, 120, 120, 120, 120, 120]);
    ok('it cannot be talked into more colours than exist', medianCut(flat, 8).length / 3 <= 2,
       `${medianCut(flat, 8).length / 3} entries`);

    // Snapping leaves nothing outside the palette.
    const snapped = snap(twoBands, TERMINAL_PALETTES.ansi16);
    const inPalette = new Set();
    for (let i = 0; i * 3 < TERMINAL_PALETTES.ansi16.length; i++) {
      inPalette.add(`${TERMINAL_PALETTES.ansi16[i * 3]},${TERMINAL_PALETTES.ansi16[i * 3 + 1]},${TERMINAL_PALETTES.ansi16[i * 3 + 2]}`);
    }
    let strays = 0;
    for (let cell = 0; cell * 3 < snapped.length; cell++) {
      const at = cell * 3;
      if (!inPalette.has(`${snapped[at]},${snapped[at + 1]},${snapped[at + 2]}`)) strays++;
    }
    check('after snapping every cell is a palette colour', strays, 0);

    check('full colour snaps nothing', paletteFor('full', twoBands), null);
    ok('every offered palette resolves to something usable',
       PALETTES.every((kind) => kind === 'full' || (paletteFor(kind, twoBands)?.length ?? 0) >= 3),
       PALETTES.filter((kind) => kind !== 'full' && !paletteFor(kind, twoBands)).join(',') || 'all sound');

    // And the terminal output names entries rather than shouting in 24 bits.
    const art = String.fromCharCode(0x28FF, 0x2801);
    const ansi = brailleToAnsi(art, snapped, 2, 'ansi16');
    ok('a sixteen-colour terminal gets sixteen-colour codes',
       !ansi.includes('38;2;') && /\[\d\dm/.test(ansi), JSON.stringify(ansi.slice(0, 24)));
    ok('and full colour still gets the full codes',
       brailleToAnsi(art, snapped, 2, 'full').includes('38;2;'), 'truecolor');
  }

  // --- whether the art can still follow the sliders ------------------------
  // This was a cell count picked on one machine. The same grid is half a second
  // on a laptop and several on a phone, so the answer now comes from what the
  // last redraw actually cost.
  {
    check('with nothing measured yet, it tries', keepsUp(1000000, null), true);
    check('and a nonsense measurement does not stop it', keepsUp(5000, { ms: 100, cells: 0 }), true);

    // 30 000 cells at 300ms is 10us a cell: a fifth of that size is well inside
    // the budget, four times it is well outside.
    const measured = { ms: 300, cells: 30000 };
    check('a smaller grid keeps up', keepsUp(6000, measured), true);
    check('a much larger one does not', keepsUp(120000, measured), false);

    // The gap between stopping and starting again: a grid that costs exactly
    // the budget must not start and stop on alternate keystrokes.
    const onTheLine = { ms: LIVE_BUDGET_MS, cells: 1000 };
    check('at the budget it still follows', keepsUp(1000, onTheLine, true), true);
    check('but having stopped, it does not resume there', keepsUp(1000, onTheLine, false), false);
    const wellUnder = { ms: LIVE_RESUME_MS - 50, cells: 1000 };
    check('it resumes once redraws are comfortably quick', keepsUp(1000, wellUnder, false), true);

    // Shrinking the grid should let it follow again without waiting for another
    // redraw to prove it, which is the point of scaling the measurement.
    const slow = { ms: 2000, cells: 160000 };
    check('after shrinking, the estimate says yes', keepsUp(8000, slow, false), true);
    check('and at the old size it still says no', keepsUp(160000, slow, false), false);
  }

  const failed = log.filter((l) => l.startsWith('FAIL')).length;
  out(`${log.join('\n')}\n${failed ? `\n${failed} FAILED` : '\nAll pipeline checks passed.'}`);
}

run().catch((err) => out(`THREW: ${err?.stack ?? err}\n\n--- progress ---\n${log.join('\n')}`));
</script>
</body>
</html>
